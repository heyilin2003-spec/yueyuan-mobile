  .centerline{ position:absolute; left:-10%; top:50%; width:120%; height:1px;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 10px, transparent 10px 20px); opacity:.5; }
  .roundtag{ position:absolute; top:14px; left:50%; transform:translateX(-50%);
    font-size:12px; letter-spacing:.22em; color:#a6bcce; background:rgba(0,0,0,.25);
    padding:6px 18px; border-radius:999px; white-space:nowrap; }
  .roundtag.mine{ color:#c8f0d8; box-shadow:inset 0 0 0 1px rgba(120,240,170,.4); }
  .roundtag.foe { color:#ffc9c0; box-shadow:inset 0 0 0 1px rgba(255,140,120,.4); }

  /* ---------- 角色 ---------- */
  .side{ position:absolute; display:flex; gap:14px; z-index:3; }
  .opp{ top:34px; right:36px; flex-direction:row-reverse; align-items:flex-start; }
  .me { bottom:196px; left:36px; align-items:flex-end; }

  .avatar{ position:relative; width:126px; height:151px; }
  .avatar .figure{ position:absolute; inset:0; transform-origin:50% 92%; animation:idle 2.6s ease-in-out infinite; will-change:transform; transition:filter .65s ease; }
  .avatar .rig{ position:absolute; inset:0; }
  @keyframes idle{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  .avatar svg{ width:100%; height:100%; display:block; overflow:visible; transform:translateZ(0); }
  .avatar .thigh{ transform-box:fill-box; transform-origin:50% 0%; }
  .avatar .shin { transform-box:fill-box; transform-origin:50% 0%; }
  .avatar .upper{ transform-box:view-box; transform-origin:50% 85.8%; }

  .avatar.hit .figure{ animation:hitShake .5s ease, hitTint .5s ease; }
  @keyframes hitShake{ 0%{transform:translateX(0) rotate(0);} 15%{transform:translateX(-10px) rotate(-3deg);} 35%{transform:translateX(8px) rotate(3deg);} 55%{transform:translateX(-6px) rotate(-2deg);} 75%{transform:translateX(4px);} 100%{transform:translateX(0);} }
  @keyframes hitTint{ 0%{filter:none;} 25%{filter:brightness(1.35) saturate(2.2) hue-rotate(-30deg);} 100%{filter:none;} }

  .avatar.attack .figure{ animation:atkRecoil .5s ease; }
  @keyframes atkRecoil{ 0%{transform:none;} 22%{transform:translateX(-8px) rotate(-2deg);} 45%{transform:translateX(9px) rotate(2deg);} 100%{transform:none;} }

  .avatar .flash{ position:absolute; inset:-10px; pointer-events:none; opacity:0; border-radius:25%;
    background:radial-gradient(circle at 50% 55%, rgba(255,64,44,.6), transparent 62%); }
  .avatar .flash.on{ animation:flash .5s ease; }
  .avatar .flash.blk{ background:radial-gradient(circle at 50% 55%, rgba(90,180,255,.55), transparent 62%); }
  .avatar .flash.fire{ background:radial-gradient(circle at 50% 55%, rgba(255,150,40,.6), transparent 62%); }
  @keyframes flash{ 0%{opacity:0;} 18%{opacity:1;} 100%{opacity:0;} }

  .shieldring{ position:absolute; inset:-14px; border-radius:50%; pointer-events:none; opacity:0; transition:opacity .35s;
    border:2px solid rgba(150,215,255,.5); box-shadow:0 0 18px rgba(120,190,255,.3), inset 0 0 18px rgba(120,190,255,.22); }
  .avatar.has .shieldring{ opacity:1; }
  .shieldfx{ position:absolute; inset:-16px; border-radius:50%; pointer-events:none; opacity:0;
    border:2px solid rgba(170,225,255,.6);
    background:radial-gradient(circle at 50% 45%, rgba(120,200,255,.3), rgba(80,160,255,.12) 55%, transparent 72%);
    box-shadow:inset 0 0 24px rgba(140,210,255,.6), 0 0 24px rgba(120,190,255,.4); }
  .shieldfx.on{ animation:shieldPop .85s ease; }
  .shieldfx.absorb{ animation:shieldAbsorb .45s ease; }
  @keyframes shieldPop{ 0%{opacity:0;transform:scale(.6);} 25%{opacity:1;transform:scale(1.08);} 60%{opacity:.9;transform:scale(1);} 100%{opacity:0;transform:scale(1.16);} }
  @keyframes shieldAbsorb{ 0%{opacity:0;transform:scale(1.14);} 30%{opacity:1;transform:scale(1.02);} 100%{opacity:0;transform:scale(.94);} }

  .avatar .dmg{ position:absolute; left:50%; top:-14px; transform:translateX(-50%); font-size:25px; font-weight:800; color:#ffd34d;
    opacity:0; pointer-events:none; white-space:nowrap; text-shadow:0 2px 0 #7a4a00, 0 0 12px rgba(255,180,0,.65); }
  .avatar .dmg.on{ animation:dmgFloat .9s ease-out; }
  .avatar .dmg.block{ color:#8fd6ff; font-size:21px; text-shadow:0 2px 0 #0a3a55, 0 0 12px rgba(90,180,255,.7); }
  .avatar .dmg.gain{ color:#9fe6b5; font-size:23px; text-shadow:0 2px 0 #12452a, 0 0 12px rgba(90,230,140,.7); }
  .avatar .dmg.fire{ color:#ffb060; font-size:23px; text-shadow:0 2px 0 #6a2a00, 0 0 12px rgba(255,140,40,.7); }
  @keyframes dmgFloat{ 0%{opacity:0;transform:translate(-50%,10px) scale(.6);} 22%{opacity:1;transform:translate(-50%,-6px) scale(1.15);} 100%{opacity:0;transform:translate(-50%,-64px) scale(1);} }

  .me { --main:#3f8f5a; --main-dark:#2c6740; --skin:#f3c9a3; --wood:#8a5a2b; --leg:#41301f; --boot:#2c2016; }
  .opp{ --main:#c24a3f; --main-dark:#8f2f27; --skin:#f3c9a3; --wood:#7a4a2b; --leg:#3a2a24; --boot:#241815; }
  .avatar .m{ fill:var(--main); } .avatar .md{ fill:var(--main-dark); }
  .avatar .skin{ fill:var(--skin); } .avatar .wood{ fill:var(--wood); }
  .avatar .leg{ fill:var(--leg); } .avatar .boot{ fill:var(--boot); }
  .avatar .bows{ stroke:var(--wood); fill:none; }
  .avatar .orb{ fill:var(--main); }
  .opp .avatar svg{ transform:scaleX(-1) translateZ(0); }

  /* 立绘式角色（图片） */
  .avatar .sprite{ position:absolute; left:50%; bottom:0; height:100%; width:auto; transform:translateX(-50%) translateY(var(--sy,0px)); }
  .opp .avatar .sprite{ transform:translateX(-50%) scaleX(-1) translateY(var(--sy,0px)); }
  .charart .sprite{ width:100%; height:100%; object-fit:contain; display:block; }
  /* 图片角色的死亡（整体下蹲→侧倒） */
  .avatar.imgchar.kneel .figure{ animation:imgKneel .62s cubic-bezier(.34,.9,.4,1) forwards; }
  @keyframes imgKneel{ from{ transform:translate3d(0,0,0); } to{ transform:translate3d(0,22px,0); } }
  .avatar.imgchar.fall .figure{ animation:imgFall .85s cubic-bezier(.5,0,.85,.5) forwards; }
  @keyframes imgFall{ 0%{ transform:translate3d(0,22px,0) rotate(0deg); } 60%{ transform:translate3d(0,22px,0) rotate(-50deg); } 100%{ transform:translate3d(0,26px,0) rotate(-86deg); } }

  /* 死亡 */
  .avatar.dead{ cursor:default; }
  .avatar.dead .figure{ animation:none; }
  .avatar.kneel .figure{ animation:kneelDrop .62s cubic-bezier(.34,.9,.4,1) forwards; }
  .avatar.kneel .thigh{ animation:thighKneel .62s cubic-bezier(.34,.9,.4,1) forwards; }
  .avatar.kneel .shin { animation:shinKneel  .62s cubic-bezier(.34,.9,.4,1) forwards; }
  @keyframes kneelDrop{ from{ transform:translate3d(0,0,0); } to{ transform:translate3d(0,27px,0); } }
  @keyframes thighKneel{ from{ transform:rotate(0deg); } to{ transform:rotate(-7deg); } }
  @keyframes shinKneel { from{ transform:rotate(0deg); } to{ transform:rotate(82deg); } }
  .avatar.fall .upper{ animation:fallAnim .85s cubic-bezier(.5,0,.85,.5) forwards; }
  @keyframes fallAnim{ 0%{transform:rotate(0deg);} 30%{transform:rotate(24deg);} 60%{transform:rotate(58deg);} 100%{transform:rotate(88deg);} }
  .avatar.grayed .figure{ filter:grayscale(.92) brightness(.78); }

  /* 死亡·消散（轻量：只动 opacity/transform，不做逐帧 blur，避免掉帧） */
  .avatar.dead.dissolve{ pointer-events:none; }
  .avatar.dead.dissolve .figure{ animation:dissolveAnim .85s ease-out forwards; will-change:transform, opacity; transform:translateZ(0); }
  .avatar.dissolve .thigh, .avatar.dissolve .shin, .avatar.dissolve .upper{ animation:none; }
  @keyframes dissolveAnim{
    0%{ opacity:1; transform:translateY(0) scale(1); }
    45%{ opacity:.62; transform:translateY(-7px) scale(1.05); }
    100%{ opacity:0; transform:translateY(-24px) scale(1.12); }
  }
  .avatar .flash.unmake{ background:radial-gradient(circle at 50% 55%, rgba(175,228,255,.6), transparent 62%); }
  .avatar.dissolve .flash.on{ animation:unmakeFlash .8s ease-out; }
  @keyframes unmakeFlash{ 0%{ opacity:0; transform:scale(.55); } 25%{ opacity:1; } 100%{ opacity:0; transform:scale(1.6); } }

  /* 状态条 */
  .status{ width:196px; padding-top:4px; }
  .pname{ font-size:13px; letter-spacing:.14em; color:#cfe8da; margin-bottom:6px; }
  .hpbar{ position:relative; height:19px; border-radius:10px; background:rgba(0,0,0,.4); overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
  .hpbar i{ position:absolute; inset:0 auto 0 0; width:100%; background:linear-gradient(90deg,#e0574a,#c13a2c); border-radius:10px; transition:width .35s; }
  .opp .hpbar i{ background:linear-gradient(90deg,#e0724a,#c14a2c); }
  .hpbar span{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  .chips{ display:flex; gap:7px; margin-top:7px; flex-wrap:wrap; }
  .chip{ font-size:11.5px; padding:4px 11px; border-radius:999px; background:rgba(255,255,255,.1); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }
  .chip.ap b{ color:#7fd0ff; } .chip.sh b{ color:#9fe6b5; }
  .debuffs{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .debuff{ font-size:10.5px; padding:3px 9px; border-radius:999px; color:#ffcf9a; background:rgba(255,140,60,.18); box-shadow:inset 0 0 0 1px rgba(255,160,80,.5); }
  .debuff.passive{ color:#cbd8ff; background:rgba(120,150,255,.16); box-shadow:inset 0 0 0 1px rgba(140,170,255,.5); }

  /* 对手手牌（摊开可见） */
  .foehand{ position:absolute; top:34px; left:36px; display:flex; gap:8px; z-index:2; }
  .foeback{ width:56px; height:78px; border-radius:9px; background:linear-gradient(150deg,#1f5c8f,#123a5c);
    box-shadow:0 6px 14px rgba(0,0,0,.4), inset 0 0 0 3px rgba(255,255,255,.14); position:relative; }
  .foeback::after{ content:''; position:absolute; inset:11px; border-radius:5px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.18); }
  /* 中央：对手最近打出的一张牌 */
  .playedbox{ margin-top:10px; display:flex; justify-content:center; min-height:104px; }
  .playedbox .mini{ animation:playIn .45s cubic-bezier(.2,1.2,.4,1); }
  @keyframes playIn{ 0%{ transform:translateY(12px) scale(.8); opacity:0; } 100%{ transform:none; opacity:1; } }
  /* 手牌通用小卡 */
  .mini{ width:74px; height:102px; border-radius:10px; background:linear-gradient(158deg,#fffdf7,#f4efe3);
    border:1px solid rgba(0,0,0,.16); box-shadow:0 8px 16px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.6);
    position:relative; padding:7px 6px; display:flex; flex-direction:column; color:#20242a; transition:transform .14s, box-shadow .14s, opacity .2s; }
  .mini .cc{ position:absolute; top:5px; left:7px; font-size:13px; font-weight:800; }
  .mini .cn{ text-align:center; font-size:11px; font-weight:700; margin-top:2px; }
  .mini .ca{ flex:1; margin:6px 2px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:17px; font-weight:800; }
  .mini .ce{ font-size:8.5px; line-height:1.3; text-align:center; color:#4a5158; }
  .c-atk .ca{ background:linear-gradient(150deg,#e0574a,#a92c1e); } .c-atk .cc{ color:#c9412f; }
  .c-mul .ca{ background:linear-gradient(150deg,#eda43f,#c06a12); } .c-mul .cc{ color:#d98524; }
  .c-sta .ca{ background:linear-gradient(150deg,#9a6be0,#5a2fa0); } .c-sta .cc{ color:#7a49c7; }
  .c-skl .ca{ background:linear-gradient(150deg,#4a9ac4,#1f5e85); } .c-skl .cc{ color:#2f7ba6; }
  .c-pas .ca{ background:linear-gradient(150deg,#7b8cff,#3b4bc0); } .c-pas .cc{ color:#4a5ad0; }
  .c-ctl .ca{ background:linear-gradient(150deg,#b06be0,#6a2fa0); } .c-ctl .cc{ color:#8a3fc7; }

  .hand{ position:absolute; left:388px; right:248px; bottom:22px; display:flex; flex-wrap:nowrap; gap:0; justify-content:center; align-items:flex-end; z-index:3; }
  .hand .mini{ width:96px; height:132px; flex:0 0 auto; margin-left:var(--ov,-46px); }
  .hand .mini:first-child{ margin-left:0; }
  .hand .mini .cc{ font-size:15px; } .hand .mini .cn{ font-size:12.5px; }
  .hand .mini .ca{ font-size:22px; margin:8px 3px; } .hand .mini .ce{ font-size:10px; }

  .handactive .mini{ cursor:pointer; }
  .handactive .mini:hover{ transform:translateY(-11px); z-index:6; box-shadow:0 18px 30px rgba(0,0,0,.55), inset 0 0 0 3px rgba(255,255,255,.75); }
  .handidle .mini{ filter:brightness(.88) saturate(.85); }
  .hand.discarding .mini{ box-shadow:0 0 0 2px rgba(255,205,110,.85), 0 8px 16px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.6) !important; }
  .hand.discarding .mini:hover{ transform:translateY(-10px); }

  .playable{ box-shadow:0 0 0 2px rgba(120,240,170,.75), 0 8px 16px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.6) !important; }
  .unplayable{ filter:brightness(.62) saturate(.6) !important; }

  /* 结束回合等 */
  .util{ position:absolute; bottom:28px; right:36px; z-index:3; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .endbtn{ font-family:inherit; font-size:13px; letter-spacing:.14em; padding:11px 24px; border-radius:12px; border:1px solid rgba(255,255,255,.3);
    background:linear-gradient(180deg,#e0a53a,#b97a1c); color:#231502; font-weight:800; cursor:pointer; box-shadow:0 8px 18px rgba(0,0,0,.4); }
  .endbtn:hover{ filter:brightness(1.08); }
  .endbtn:disabled{ filter:grayscale(.6) brightness(.7); cursor:not-allowed; }
  .drawpile{ font-size:11px; color:#9fb2c4; letter-spacing:.08em; text-align:right; }

  /* 中央信息 */
  .field{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:340px; text-align:center; z-index:2; }
  .logline{ font-size:12.5px; color:#bfe0cd; min-height:20px; letter-spacing:.04em; }
  .discardhint{ margin-top:8px; font-size:12px; color:#ffd9a0; letter-spacing:.06em; }
  .discardhint.on{ animation:blink 1s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

  .projectile{ position:absolute; width:56px; height:12px; opacity:0; pointer-events:none; z-index:5; transform-origin:50% 50%; }
  .projectile svg{ width:100%; height:100%; }
  .projectile.orb{ width:34px; height:34px; filter:drop-shadow(0 0 9px rgba(160,120,255,.95)); }
  .projectile.qi{ width:50px; height:120px; filter:drop-shadow(0 0 10px rgba(150,220,255,.95)); }
  .projectile.spincard{ width:28px; height:40px; filter:drop-shadow(0 0 6px rgba(255,90,90,.6)); }

  /* 骰子 */
  .dicebox{ position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); z-index:18; opacity:0; pointer-events:none; }
  .dicebox.on{ animation:diceIn 1.5s ease; }
  .dicerow{ display:flex; gap:14px; }
  @keyframes diceIn{ 0%{opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-35deg);} 12%{opacity:1;} 65%{opacity:1; transform:translate(-50%,-50%) scale(1.18) rotate(14deg);} 100%{opacity:0; transform:translate(-50%,-50%) scale(1) rotate(0deg);} }
  .dice{ width:82px; height:82px; border-radius:15px; background:linear-gradient(160deg,#fff,#e8e0cf);
    box-shadow:0 12px 26px rgba(0,0,0,.55), inset 0 0 0 3px rgba(255,255,255,.65);
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:10px; gap:3px; }
  .dice .pip{ width:13px; height:13px; border-radius:50%; background:#c9412f; align-self:center; justify-self:center; }

  .banner{ position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 50%, rgba(0,0,0,.5), rgba(0,0,0,.78)); opacity:0; pointer-events:none; transition:opacity .5s ease; }
  .banner.on{ opacity:1; pointer-events:auto; }
  .banner-inner{ text-align:center; }
  .banner-title{ font-size:66px; font-weight:900; letter-spacing:.3em; color:#ffd34d; text-shadow:0 4px 0 #7a4a00, 0 0 34px rgba(255,200,60,.65); }
  .banner.on .banner-title{ animation:titlePop .75s cubic-bezier(.2,1.4,.4,1); }
  @keyframes titlePop{ 0%{transform:scale(.4);opacity:0;} 60%{transform:scale(1.12);opacity:1;} 100%{transform:scale(1);} }
  .banner-sub{ margin-top:12px; font-size:14px; letter-spacing:.3em; color:#cfe8da; }
  .againbtn{ margin-top:26px; font-family:inherit; font-size:13px; letter-spacing:.14em; padding:10px 26px; border-radius:12px;
    border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.1); color:#e8f2ec; cursor:pointer; }
  .againbtn:hover{ background:rgba(255,255,255,.2); }

  .select.on{ display:flex; }
  .select h2{ font-size:16px; letter-spacing:.28em; color:#e3ecf5; margin:0; font-weight:700; }
  .emblem{ width:50px; height:50px; }
  .emblem svg{ width:100%; height:100%; display:block; }
  .chargrid{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; max-width:820px; max-height:47vh; overflow-y:auto; padding:4px 8px; }
  .chsearch{ width:260px; padding:9px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.28); color:#e8f2ec; font-family:inherit; font-size:13px; letter-spacing:.08em; outline:none; }
  .chsearch::placeholder{ color:#7f9d8d; }
  .chsearch:focus{ border-color:#6fd39a; }
  .charcard{ width:164px; padding:13px 10px; border-radius:14px; cursor:pointer; text-align:center;
    background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); transition:.18s; }
  .charcard:hover{ transform:translateY(-6px); background:rgba(255,255,255,.1); }
  .charcard.sel{ box-shadow:inset 0 0 0 2px #7fe0a8, 0 0 26px rgba(120,240,170,.35); background:rgba(120,240,170,.1); }
  .charart{ width:86px; height:104px; margin:0 auto 8px; }
  .charart svg{ width:100%; height:100%; display:block; overflow:visible; }
  .charart .m{ fill:var(--main); } .charart .md{ fill:var(--main-dark); }
  .charart .skin{ fill:#f3c9a3; } .charart .wood{ fill:#8a5a2b; }
  .charart .leg{ fill:#41301f; } .charart .boot{ fill:#2c2016; }
  .charart .orb{ fill:var(--main); }
  .charname{ font-size:15px; font-weight:700; letter-spacing:.08em; }
  .chartag{ font-size:10.5px; color:#9fb2c4; letter-spacing:.12em; margin-top:2px; }
  .chardesc{ font-size:10.5px; color:#8ea2b4; margin-top:6px; line-height:1.35; }
  .btnrow{ display:flex; gap:12px; align-items:center; }
  .selwrap{ display:flex; gap:18px; align-items:flex-start; justify-content:center; flex-wrap:wrap; }
  .deckpreview{ width:300px; max-height:300px; overflow:auto; padding:12px; border-radius:14px;
    background:rgba(0,0,0,.26); box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); }
  .decktitle{ font-size:11px; letter-spacing:.2em; color:#9fb2c4; margin-bottom:10px; }
  .decklist{ display:flex; flex-wrap:wrap; gap:7px; }
  .decklist .mini{ width:62px; height:86px; }
  .decklist .mini .ce{ font-size:8px; }

  function bodyHTML(body){
    if (body === 'swordsman') return '<img class="sprite" src="' + SPRITE_SWORDSMAN + '" alt="">';
    if (body === 'gambler')   return '<img class="sprite" src="' + SPRITE_GAMBLER + '" alt="">';
    if (body === 'giant')     return '<img class="sprite" src="' + SPRITE_GIANT + '" alt="">';
    if (body === 'ranger')    return '<img class="sprite" src="' + SPRITE_RANGER + '" alt="">';
    if (body === 'trickster') return '<img class="sprite" src="' + SPRITE_TRICKSTER + '" alt="">';
    return body === 'trickster' ? TRICKSTER : RANGER;
  }

  /* ================= 状态 ================= */
  var meAvatar  = document.getElementById('meAvatar');
  var oppAvatar = document.getElementById('oppAvatar');
  var avatars = { me:meAvatar, opp:oppAvatar };
  var proj = document.getElementById('proj');
  var table = document.getElementById('table');
  var busy = false;

  var G;
  function newPlayer(deckKeys, owner){
    return { hp:30, max:30, shield:0, ap:0, baseAp:3, hand:[], field:[], deck:makeDeckFrom(deckKeys || DECK_KEYS, owner || 'me'), burn:0, weak:0, lifeLoss:0, drawPenalty:0, apPenalty:0, dmgTaken:0, passiveLifesteal:false, lifestealOn:false, passiveGambler:false, dead:false };
  }
  function makeDeckFrom(keys, owner){
    var arr = keys.map(function(k,i){ return { uid:k + '_' + i + '_' + Math.random().toString(36).slice(2,6), key:k, owner: owner || 'me' }; });
    return shuffle(arr);
  }
  function shuffle(a){
    for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  var chosenMe = 'ranger', chosenOpp = 'ranger';
  var chosenDiff = 'normal';
  function applyColors(who, ch){
    avatars[who].style.setProperty('--main', ch.main);
    avatars[who].style.setProperty('--main-dark', ch.dark);
    avatars[who].style.setProperty('--sy', ch.body === 'ranger' ? '12px' : '0px');   // 立绘整体下移，让弹道对手部
  }
  function reset(){
    var cm = getChar(chosenMe), co = getChar(chosenOpp);
    applyColors('me', cm); applyColors('opp', co);
    avatars.me.querySelector('.rig').innerHTML  = bodyHTML(cm.body);
    avatars.opp.querySelector('.rig').innerHTML = bodyHTML(co.body);
    avatars.me.classList.toggle('imgchar', cm.body === 'swordsman' || cm.body === 'gambler' || cm.body === 'ranger' || cm.body === 'trickster');
    avatars.opp.classList.toggle('imgchar', co.body === 'swordsman' || co.body === 'gambler' || co.body === 'ranger' || co.body === 'trickster');
    document.querySelector('.me .pname').textContent = '你 · ' + cm.name;
    document.querySelector('.opp .pname').textContent = '对手 · ' + co.name;
    G = { players:{ me:newPlayer(cm.deck,'me'), opp:newPlayer(co.deck,'opp') }, turn:'me', round:1, phase:'play', over:false, endLock:false, swapMode:false, difficulty: chosenDiff,
          log:{ me:{dmg:0,cards:[]}, opp:{dmg:0,cards:[]} } };
    [meAvatar,oppAvatar].forEach(function(a){ a.classList.remove('dead','kneel','fall','grayed','dissolve','hit','attack','has'); });
    document.getElementById('banner').classList.remove('on');
    busy = false;
    startHalfTurn('me');
  }

  /* ================= 动画工具 ================= */
  function restart(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function anim(el, cls, ms){ restart(el, cls); setTimeout(function(){ el.classList.remove(cls); }, ms); }
  function showFloat(who, text, cls){
    var d = avatars[who].querySelector('.dmg');
    d.className = 'dmg' + (cls ? ' ' + cls : '');
    d.textContent = text; void d.offsetWidth; d.classList.add('on');
  }
  function flashAvatar(who, kind){
    var f = avatars[who].querySelector('.flash');
    f.className = 'flash' + (kind ? ' ' + kind : '');
    restart(f, 'on');
  }
  function shake(who, kind){ anim(avatars[who], 'hit', 520); flashAvatar(who, kind); }
  function shieldFx(who, mode){
    var el = avatars[who].querySelector('.shieldfx');
    el.classList.remove('on','absorb'); void el.offsetWidth;
    el.classList.add('on'); if (mode==='absorb') el.classList.add('absorb');
    setTimeout(function(){ el.classList.remove('on','absorb'); }, 900);
  }
  function recoil(who){ anim(avatars[who], 'attack', 520); }

  function setProjectileChar(ch){
    if (!ch){ proj.className='projectile'; return; }
    if (ch.body === 'trickster'){
      proj.className = 'projectile orb';
      proj.innerHTML = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="rgba(150,110,255,.35)"/><circle cx="20" cy="20" r="11" fill="#b98cff"/><circle cx="20" cy="20" r="11" fill="none" stroke="#eadcff" stroke-width="2"/></svg>';
    } else if (ch.body === 'swordsman'){
      proj.className = 'projectile qi';
      proj.innerHTML = '<svg viewBox="0 0 50 120"><path d="M14,6 A70,70 0 0 1 14,114 A105,105 0 0 0 14,6 Z" fill="#cdeeff" stroke="#eaf7ff" stroke-width="2"/><path d="M19,24 A58,58 0 0 1 19,96 A88,88 0 0 0 19,24 Z" fill="#ffffff" fill-opacity="0.4"/></svg>';
    } else if (ch.body === 'gambler'){
      proj.className = 'projectile spincard';
      proj.innerHTML = '<svg viewBox="0 0 28 40"><rect x="1" y="1" width="26" height="38" rx="5" fill="#fff"/><rect x="1.6" y="1.6" width="24.8" height="36.8" rx="4.4" fill="none" stroke="#c9412f" stroke-width="1.6"/><path d="M14 9 L22 20 L14 31 L6 20 Z" fill="#c9412f"/></svg>';
    } else {
      proj.className = 'projectile';
      proj.innerHTML = '<svg viewBox="0 0 56 12"><line x1="0" y1="6" x2="44" y2="6" stroke="#d9c49a" stroke-width="3"/><polygon points="44,1 56,6 44,11" fill="#e6e6e6"/></svg>';
    }
  }
  function setProjectile(from){
    var ch = getChar(from === 'me' ? chosenMe : chosenOpp);
    setProjectileChar(ch);
  }
  function projSpeed(from, base){
    var ch = getChar(from === 'me' ? chosenMe : chosenOpp);
    return ch.body === 'swordsman' ? Math.round(base * 0.55) : base;   // 剑气更快
  }
  function fireProjectile(from, to, dur, cb){
    setProjectile(from);
    var s = avatars[from].getBoundingClientRect();
    var e = avatars[to].getBoundingClientRect();
    var sx = s.left+s.width/2, sy = s.top+s.height/2;
    var ex = e.left+e.width/2, ey = e.top+e.height/2;
    var dx = ex-sx, dy = ey-sy, ang = Math.atan2(dy,dx)*180/Math.PI;
    var t = table.getBoundingClientRect();
    var pw = proj.offsetWidth || 56, ph = proj.offsetHeight || 12;
    proj.style.left = (sx - t.left - pw/2) + 'px';
    proj.style.top  = (sy - t.top - ph/2) + 'px';
    proj.style.opacity = 1;
    var spin = proj.classList.contains('spincard');
    var frames = spin
      ? [ { transform:'translate(0,0) rotate('+ang+'deg) rotate(0deg)' },
          { transform:'translate('+(dx*0.34).toFixed(1)+'px,'+(dy*0.34).toFixed(1)+'px) rotate('+ang+'deg) rotate(240deg)' },
          { transform:'translate('+(dx*0.68).toFixed(1)+'px,'+(dy*0.68).toFixed(1)+'px) rotate('+ang+'deg) rotate(480deg)' },
          { transform:'translate('+dx+'px,'+dy+'px) rotate('+ang+'deg) rotate(720deg)' } ]
      : [ { transform:'translate(0,0) rotate('+ang+'deg)' },
          { transform:'translate('+dx+'px,'+dy+'px) rotate('+ang+'deg)' } ];
    var a = proj.animate(frames, { duration:dur, easing:'ease-in' });
    a.onfinish = function(){ proj.style.opacity = 0; if (cb) cb(); };
  }

  /* ================= 伤害结算 ================= */
  function takeHit(who, dmg, pierce, cb, dealer){
    var p = G.players[who];
    if (p.dead){ if (cb) cb(); return 0; }
    var before = p.hp;
    if (!pierce && p.shield > 0){
      var absorbed = Math.min(p.shield, dmg);
      p.shield -= absorbed;
      var left = dmg - absorbed;
      shieldFx(who,'absorb');
      if (left > 0){
        shake(who, 'blk'); showFloat(who, '格挡 '+absorbed, 'block');
        setTimeout(function(){ showFloat(who, '-'+left); }, 250);
        p.hp = Math.max(0, p.hp - left);
      } else { shake(who, 'blk'); showFloat(who, '格挡 '+absorbed, 'block'); }
    } else {
      p.hp = Math.max(0, p.hp - dmg);
      shake(who, pierce ? 'fire' : '');
      showFloat(who, '-'+dmg, pierce ? 'fire' : '');
    }
    p.dmgTaken = (p.dmgTaken || 0) + (before - p.hp);   // 记录本回合受创
    var lost = before - p.hp;
    if (dealer && G.turnStat && G.turnStat.seat === dealer) G.turnStat.dmg += lost;   // 本回合爆发，在死亡结算前记入
    updateUI();
    if (p.hp <= 0){ die(who); if (cb) cb(); return lost; }
    if (cb) cb();
    return lost;
  }

  // 治疗
  function heal(who, n){
    var p = G.players[who];
    p.hp = Math.min(p.max, p.hp + n);
    showFloat(who, '+'+n, 'gain');
    updateUI();
  }

  // 由 from 发起的一次伤害：叠加增伤 + 被动转穿刺
  function hitFrom(from, to, base, pierce, cb){
    var fp = G.players[from];
    var dmg = base + (fp.dmgBuff || 0);
    if (fp.passiveRanger){
      if (fp.charge){ pierce = true; fp.charge = false; fp.hitCount = 0; }
      else { fp.hitCount = (fp.hitCount || 0) + 1; if (fp.hitCount >= 2){ fp.charge = true; fp.hitCount = 0; } }
    }
    if (fp.weak > 0 && !pierce) dmg -= 1;    // 虚弱：非穿刺伤害每段 -1
    if (dmg < 0) dmg = 0;
    var lost = takeHit(to, dmg, pierce, cb, from);
    if (fp.passiveLifesteal && fp.lifestealOn && !fp.dead && lost > 0){
      heal(from, Math.max(1, Math.round(lost * 0.2)));   // 嗜血：20% 吸血
    }
    return lost;
  }

  // 多段攻击序列（每段一次飞箭）
  function attackSeq(from, to, hits, extraPierce, onDone){
    recoil(from); busy = true;
    var n = hits.length, done = 0, stopped = false;
    var multi = n > 1;
    for (var i=0;i<n;i++){ (function(i){
      setTimeout(function(){
        if (stopped || G.over) return;
        fireProjectile(from, to, projSpeed(from, multi ? 220 : 400), function(){
          hitFrom(from, to, hits[i].dmg, !!(hits[i].pierce || extraPierce), function(){
            if (G.over){ stopped = true; busy = false; if (onDone) onDone(); return; }
            if (++done === n){ busy = false; updateUI(); if (onDone) onDone(); }
          });
        });
      }, multi ? (150 + i*230) : 120);
    })(i); }
  }
  /* ================= 出牌 ================= */
  function playCard(who, idx){
    if (G.over || G.phase!=='play' || G.turn!==who) return;
    var p = G.players[who];
    var c = p.hand[idx]; if (!c) return;
    var d = DEFS[c.key];
    if (d.cost > p.ap){ log('行动力不足，出不了「'+d.name+'」'); return; }

    p.ap -= d.cost;
    p.hand.splice(idx,1);
    if (who === 'opp') showPlayed(c.key);      // 对手出的牌亮在中央
    if (G.turnStat && G.turnStat.seat === who) G.turnStat.cards.push(d.name);

    if (d.passive){                       // 被动：不耗行动力，直接留场
      p.field.push(c);
      if (c.key === 'pas_ranger') p.passiveRanger = true;
      if (c.key === 'pas_trickster') p.passiveTrickster = true;
      if (c.key === 'pas_sword') p.passiveLifesteal = true;   // 血量低于一半时 20% 吸血
      if (c.key === 'pas_gambler') p.passiveGambler = true;   // 千术：降低掷出 1/2/3 的概率
      log(pname(who)+' 被动生效：'+d.name+'（不耗行动力）');
      updateUI(); return;
    }

    // 普通牌：洗回「原主」的牌堆（换来的牌不进自己牌堆）
    var od = G.players[c.owner || who].deck;
    od.push(c); shuffle(od);

    var foe = enemyOf(who);

    if (c.key === 'strike' || c.key === 'strike3' || c.key === 'strike2'){
      var sd = d.dmg || 4;
      log(pname(who)+' 普通攻击 → '+sd+' 点伤害'+(d.draw?('、抽 '+d.draw+' 张'):''));
      attackSeq(who, foe, [ {dmg: sd} ], false);
      if (d.draw) drawCards(who, d.draw);
    }
    else if (c.key === 'multi'){
      log(pname(who)+' 多次攻击 → 4 次 1 点');
      attackSeq(who, foe, [ {dmg:1},{dmg:1},{dmg:1},{dmg:1} ], false);
    }
    else if (c.key === 'dagger'){
      log(pname(who)+' 短匕 → 3 点穿刺 + 回 1 血');
      attackSeq(who, foe, [ {dmg:3, pierce:true} ], false, function(){ heal(who, 1); });
    }
    else if (c.key === 'assault'){
      log(pname(who)+' 突击 → 6 次 1 点穿刺');
      attackSeq(who, foe, [ {dmg:1,pierce:true},{dmg:1,pierce:true},{dmg:1,pierce:true},{dmg:1,pierce:true},{dmg:1,pierce:true},{dmg:1,pierce:true} ], false);
    }
    else if (c.key === 'longbow'){
      p.dmgBuff = (p.dmgBuff || 0) + 1;
      showFloat(who, '增伤+1', 'gain');
      log(pname(who)+' 长弓 → 增伤 +1（本半回合有效）');
      updateUI();
    }
    else if (c.key === 'rest'){
      heal(who, 3);
      p.ap = p.ap + 1;             // 允许超过 3 点
      log(pname(who)+' 侠客行 → 回 3 血、回 1 行动力');
      updateUI();
    }
    else if (c.key === 'fullbow'){
      drawCards(who, 1);
      p.shield = Math.min(30, p.shield + 3);
      shieldFx(who, 'gain'); showFloat(who, '+3盾', 'gain');
      log(pname(who)+' 满弓 → 抽 1 张、+3 护盾');
      updateUI();
    }
    else if (c.key === 'burn'){
      var f = G.players[foe];
      f.burn += 3;
      showFloat(foe, '灼烧', 'fire');
      log(pname(who)+' 打出 灼烧，'+pname(foe)+' 被点燃 '+f.burn+' 回合');
      updateUI();
    }
    else if (c.key === 'drawcut'){
      G.players[foe].drawPenalty += 1;
      log(pname(who)+' 干扰：'+pname(foe)+' 下回合少抽 1 张');
      updateUI();
    }
    else if (c.key === 'energycut'){
      G.players[foe].apPenalty += 1;
      log(pname(who)+' 干扰：'+pname(foe)+' 下回合回能 -1');
      updateUI();
    }
    else if (c.key === 'swapsoul'){
      if (who === 'me'){
        G.swapMode = true;
        log('移形换影：点一张你的手牌交给对手');
        updateUI();
      } else {
        aiSwap();
      }
    }
    else if (c.key === 'trick'){
      log(pname(who)+' 诡术 → 3 点伤害 + 1 回合虚弱');
      attackSeq(who, foe, [ {dmg:3} ], false, function(){ applyWeak(foe, 1); });
    }
    else if (c.key === 'twinblade'){
      log(pname(who)+' 双刀 → 4 次 1 点穿刺');
      attackSeq(who, foe, [ {dmg:1,pierce:true},{dmg:1,pierce:true},{dmg:1,pierce:true},{dmg:1,pierce:true} ], false);
    }
    else if (c.key === 'focused'){
      p.dmgBuff = (p.dmgBuff || 0) + (d.buff || 1);
      showFloat(who, '增伤+'+(d.buff||1), 'gain');
      log(pname(who)+' 无心极意 → 增伤 +'+(d.buff||1)+'（本半回合有效）');
      updateUI();
    }
    else if (c.key === 'qianyun'){
      var sum = rollDiceN(who, d.dice || 2);
      log(pname(who)+' 千云 → 造成 '+sum+' 点穿刺伤害');
      (function(sm){ setTimeout(function(){ if (!G.over) attackSeq(who, foe, [ {dmg: sm, pierce:true} ], false); }, 750); })(sum);
    }
    else if (c.key === 'sakura'){
      heal(who, 4); drawCards(who, 1);
      log(pname(who)+' 斩樱 → 回 4 血、抽 1 张');
      updateUI();
    }
    else if (c.key === 'gambling'){
      var hf = rollDiceN(who, 1);
      heal(who, hf);
      var gd = 6 - hf;
      log(pname(who)+' 赌运 → 回 '+hf+' 血' + (gd>0 ? ('，造成 '+gd+' 点伤害') : ''));
      if (gd > 0) (function(sm){ setTimeout(function(){ if (!G.over) attackSeq(who, foe, [ {dmg: sm} ], false); }, 700); })(gd);
      updateUI();
    }
    else if (c.key === 'highstake'){
      var hd = rollDiceN(who, 1);
      log(pname(who)+' 豪赌 → 造成 '+hd+' 点伤害');
      (function(sm){ setTimeout(function(){ if (!G.over) attackSeq(who, foe, [ {dmg: sm} ], false); }, 700); })(hd);
    }
    else if (c.key === 'allin'){
      var fs = rollDiceFaces(who, 2);
      var diff = Math.abs(fs[0] - fs[1]);
      drawCards(who, diff);
      log(pname(who)+' 一掷千金 → 两骰相差 '+diff+'，抽 '+diff+' 张');
      updateUI();
    }
    else if (c.key === 'stop'){
      p.ap = p.ap + 2;
      showFloat(who, '+2行动力', 'gain');
      log(pname(who)+' 止损 → 回 2 行动力');
      updateUI();
    }
    else if (c.key === 'allin2'){
      var f2 = rollDiceFaces(who, 2);
      var d2 = Math.abs(f2[0] - f2[1]) * 2;
      G.players[foe].lifeLoss = (G.players[foe].lifeLoss || 0) + d2;
      showFloat(foe, '生命损失 '+d2, 'fire');
      log(pname(who)+' ALL IN → 两骰相差 '+Math.abs(f2[0]-f2[1])+'，给 '+pname(foe)+' '+d2+' 点生命损失（回合末结算）');
      updateUI();
    }
    else if (c.key === 'charm'){
      heal(who, 3); p.ap = p.ap + 1;
      log(pname(who)+' 妖媚 → 回 3 血、回 1 行动力');
      updateUI();
    }
    else if (c.key === 'swordintent'){
      heal(who, 2); p.ap = p.ap + 1;
      log(pname(who)+' 剑意 → 回 2 血、回 1 行动力');
      updateUI();
    }
    else if (c.key === 'bloodweep'){
      var bw = G.players[foe];
      bw.lifeLoss = (bw.lifeLoss || 0) + d.lifeloss;
      drawCards(who, d.draw || 0);
      showFloat(foe, '生命损失', 'fire');
      log(pname(who)+' 泣血 → '+pname(foe)+' 获得 '+d.lifeloss+' 点生命损失，'+pname(who)+' 抽 2 张');
      updateUI();
    }
    else if (c.key === 'shield' || c.key === 'guard'){
      var blk = d.block || 6;
      p.shield = Math.min(30, p.shield + blk);
      shieldFx(who, 'gain'); showFloat(who, '+'+blk, 'gain');
      if (d.draw) drawCards(who, d.draw);
      log(pname(who)+' '+d.name+' → +'+blk+' 护盾'+(d.draw?('、抽 '+d.draw+' 张'):''));
      updateUI();
    }
  }

  // 移形换影（玩家）：给出选定的一张，随机从对手手里拿回一张
  function doSwap(giveUid){
    var me = G.players.me, op = G.players.opp;
    if (me.hand.length === 0 || op.hand.length === 0){ log('移形换影：无法交换（一方没手牌）'); updateUI(); return; }
    var ri = Math.floor(Math.random()*op.hand.length);
    var got = op.hand.splice(ri,1)[0];
    me.hand.push(got);
    var gi = -1;
    for (var i=0;i<me.hand.length;i++){ if (me.hand[i].uid === giveUid){ gi = i; break; } }
    if (gi >= 0){ var gv = me.hand.splice(gi,1)[0]; op.hand.push(gv); }
    log('移形换影：你给出一张，换来一张');
    updateUI();
  }
  // 移形换影（AI）：给出评分最低的一张，随机拿回一张
  function aiSwap(){
    var me = G.players.me, op = G.players.opp;
    if (me.hand.length === 0 || op.hand.length === 0){ log('移形换影：无法交换'); updateUI(); return; }
    var wi = 0, ws = Infinity;
    for (var i=0;i<op.hand.length;i++){ var s = aiScore(op.hand[i], op, me); if (s < ws){ ws = s; wi = i; } }
    var gv = op.hand.splice(wi,1)[0];
    me.hand.push(gv);
    var ri = Math.floor(Math.random()*me.hand.length);
    var got = me.hand.splice(ri,1)[0];
    op.hand.push(got);
    log('移形换影：对手给出一张，换来一张');
    updateUI();
  }

  // 虚弱：不可叠加，已有则无效
  function applyWeak(target, turns){
    var p = G.players[target];
    if (p.weak > 0){ log(pname(target)+' 已有虚弱，不可叠加（无效）'); return; }
    p.weak = turns;
    showFloat(target, '虚弱', 'block');
    log(pname(target)+' 被施加虚弱 '+turns+' 回合');
    updateUI();
  }

  // 生命损失：完整回合结束结算一次，无视护盾/减伤
  function settleLifeLoss(){
    ['me','opp'].forEach(function(who){
      var p = G.players[who];
      if (G.over || p.dead || !(p.lifeLoss > 0)) return;
      var v = p.lifeLoss; p.lifeLoss = 0;
      log(pname(who)+' 生命损失结算：-'+v+'（无视护盾与减伤）');
      showFloat(who, '-'+v, 'fire'); shake(who, 'fire');
      p.hp = Math.max(0, p.hp - v);
      p.dmgTaken = (p.dmgTaken||0) + v;
      updateUI();
      if (p.hp <= 0) die(who);
    });
  }

  /* ================= 回合流转 ================= */
  function startHalfTurn(who){
    G.turn = who; G.phase = 'play'; G.endLock = false; G.swapMode = false;
    G.turnStat = { seat: who, dmg: 0, cards: [] };
    var p = G.players[who];
    p.lifestealOn = !!(p.passiveLifesteal && p.hp < p.max/2);   // 嗜血：半回合开始时判定
    var base = p.baseAp || 3;
    var ap = Math.max(0, base - (p.apPenalty || 0)); p.apPenalty = 0;
    p.ap = ap;
    var rd = (who === 'me');           // 大回合开始（一回合的第一半）：双方一起抽牌
    if (rd) roundDraw();
    log('第 '+G.round+' 回合'+(rd?'开始 · 双方各抽牌':'')+' · '+pname(who)+'的半回合：行动力 '+ap);
    updateUI();
    if (who === 'opp' && !G.over) setTimeout(aiTurn, 850);   // 对手由 AI 接手
  }

  function roundDraw(){                          // 大回合开始：所有存活者一起抽牌
    ['me','opp'].forEach(function(w){
      var pl = G.players[w]; if (pl.dead) return;
      var n = Math.max(0, 3 - (pl.drawPenalty || 0)); pl.drawPenalty = 0;
      drawCards(w, n);
    });
  }
  function endHalfTurn(){                        // 玩家点「结束半回合」
    if (G.over || G.phase!=='play' || G.turn!=='me' || G.endLock) return;
    endTurnInternal('me');
  }
  function endTurnInternal(who){
    if (G.over || G.phase!=='play' || G.endLock) return;
    G.endLock = true;
    finalizeBurst();
    resolveBurn(who, function(){
      if (G.over) return;
      var p = G.players[who];
      p.dmgBuff = 0;               // 增伤：只持续本半回合
      if (p.weak > 0) p.weak -= 1; // 虚弱：在本方半回合结束时递减
      if (p.hand.length > 4){
        G.phase = 'discard';
        log(pname(who)+' 手牌 '+p.hand.length+' 张，超过上限 4，'+(who==='me'?'请点击弃牌':'对手弃牌中'));
        updateUI();
        if (who === 'opp') setTimeout(aiDiscard, 650);
        return;
      }
      passTurn(who);
    });
  }

  function passTurn(from){
    var to = enemyOf(from);
    if (to === 'me'){                 // 一个完整回合结束
      settleLifeLoss();               // 生命损失先结算
      checkFaceSwap();
      G.round++;
      G.players.me.dmgTaken = 0; G.players.opp.dmgTaken = 0;
    }
    endBtnDisable(false);
    startHalfTurn(to);
  }

  // 诡术师被动：完整回合内双方受创相等 → 仅当「对自己有利」时才交换血量
  function faceSwap(who){
    var me = G.players.me, op = G.players.opp;
    var t = me.hp; me.hp = op.hp; op.hp = t;
    log('换脸触发！本回合双方受创一致，'+pname(who)+' 取走对方血量');
    showFloat('me', '换脸', 'fire'); showFloat('opp', '换脸', 'fire');
    updateUI();
  }
  function checkFaceSwap(){
    var me = G.players.me, op = G.players.opp;
    if (!(me.dmgTaken > 0 && me.dmgTaken === op.dmgTaken)) return;
    if (me.passiveTrickster && me.hp < op.hp) faceSwap('me');        // 自己血少才换（稳赚）
    else if (op.passiveTrickster && op.hp < me.hp) faceSwap('opp');  // 对手血少才换
  }

  function resolveBurn(who, cb){
    var p = G.players[who];
    if (p.burn > 0 && !p.dead){
      var dmg = Math.round(p.hp * 0.10);
      dmg = Math.max(1, dmg);
      showFloat(who, '灼烧 -'+dmg, 'fire');
      setTimeout(function(){
        p.burn -= 1;
        updateUI();
        takeHit(who, dmg, true, cb);   // 穿刺：无视护盾
      }, 260);
    } else { cb(); }
  }

  function drawCards(who, n){
    var p = G.players[who];
    for (var i=0;i<n;i++){
      if (p.deck.length === 0) break;
      p.hand.push(p.deck.shift());        // 被动牌也进手牌，由玩家手动打出
    }
  }

  /* ================= 弃牌 ================= */
  function discardCard(who, idx){
    if (G.phase !== 'discard' || G.turn !== who) return;
    var p = G.players[who];
    var c = p.hand.splice(idx,1)[0];
    if (c){ var od = G.players[c.owner || who].deck; od.push(c); shuffle(od); }
    log(pname(who)+' 弃掉一张牌');
    if (p.hand.length <= 4){
      G.phase = 'play';
      passTurn(who);
    } else { updateUI(); }
  }

  /* ================= AI 出牌逻辑 ================= */
  function hasDmgCard(p, exceptKey){
    for (var i=0;i<p.hand.length;i++){ var k=p.hand[i].key; if (k!==exceptKey && DEFS[k].dmg) return true; }
    return false;
  }
  function hasAffordableAttack(p, exceptKey, apLeft){
    for (var i=0;i<p.hand.length;i++){ var k=p.hand[i].key; if (k!==exceptKey && DEFS[k].dmg && DEFS[k].cost <= apLeft) return true; }
    return false;
  }
  // 单张牌对目标的有效伤害（计入增伤、护盾、穿刺）
  function effDamage(d, p, f){
    var hits = d.hits || 1;
    var per = (d.dmg || 0) + (p.dmgBuff || 0);
    if (per <= 0) return 0;
    if (d.pierce) return per * hits;
    var shield = f.shield, total = 0;
    for (var i=0;i<hits;i++){
      var h = per;
      if (shield > 0){ var a = Math.min(shield, h); shield -= a; h -= a; }
      total += h;
    }
    return total;
  }
  // 以给定增伤层数计算单张牌的有效伤害
  function effDamageB(d, buff, f){
    var hits = d.hits || 1;
    var per = (d.dmg || 0) + buff;
    if (per <= 0) return 0;
    if (d.pierce) return per * hits;
    var shield = f.shield, total = 0;
    for (var i=0;i<hits;i++){ var h = per; if (shield > 0){ var a = Math.min(shield, h); shield -= a; h -= a; } total += h; }
    return total;
  }
  // 本回合最大可能伤害（贪心估算，用于斩杀判断）
  function dmgPotential(p, f){
    var ap = p.ap, buff = p.dmgBuff || 0, total = 0, hand = p.hand;
    for (var a=0;a<hand.length;a++){ var da=DEFS[hand[a].key]; if (da.cost===0 && da.apGain) ap += da.apGain; }
    for (var i=0;i<hand.length;i++){ var d=DEFS[hand[i].key]; if (d.buff && d.cost<=ap){ ap-=d.cost; buff+=d.buff; } }
    var cards=[];
    for (var j=0;j<hand.length;j++){ var dd=DEFS[hand[j].key]; if (dd.dmg) cards.push(dd); }
    cards.sort(function(x,y){ return (effDamageB(y,buff,f)/y.cost) - (effDamageB(x,buff,f)/x.cost); });
    for (var k=0;k<cards.length;k++){ if (cards[k].cost<=ap){ ap-=cards[k].cost; total += effDamageB(cards[k],buff,f); } }
    return total;
  }
  // 评分（不考虑行动力，具体可出性在 aiChoose 里筛）
  function aiScore(c, p, f){
    var d = DEFS[c.key];
    var diff = (typeof G !== 'undefined' && G && G.difficulty) || 'normal';
    if (d.passive) return 72;                // 被动：不耗行动力、永久生效，值得尽早打出
    if (d.apGain && d.cost === 0) return 80 + (p.hp < p.max ? 15 : 0);   // 零费又回能，稳赚
    if (diff !== 'easy' && d.dmg && effDamage(d, p, f) >= f.hp) return 1000 + d.dmg;   // 能斩杀
    var s = 0;
    if (diff === 'easy'){                    // 简单：只看表面数值，不会配合/不会防守
      if (d.dmg)   s += effDamage(d, p, f) * 6;
      if (d.block) s += d.block;
      if (d.heal)  s += Math.min(d.heal, p.max - p.hp) * 4;
      if (d.draw)  s += 3;
      if (d.buff)  s += 6;
      return s;
    }
    if (d.buff)  s += (hasAffordableAttack(p, c.key, p.ap - d.cost) ? 60 : 4);  // 还有买得起的攻击牌才值得先上增伤
    var dw = (f.hp <= 15) ? 12 : 9;   // 对面残血时更激进
    if (d.dmg)   s += effDamage(d, p, f) * dw;
    if (d.debuff === 'burn') s += 22;
    if (d.disrupt) s += 15;
    if (d.weak)  s += 18;
    if (d.lifeloss) s += 20;
    if (d.lifelossDiceDiff) s += 24;
    if (d.swap)  s += 16;
    if (d.block) s += 6 + (p.hp < p.max ? 8 : 0) + d.block;
    if (d.draw)  s += 7;
    if (d.heal)  s += Math.min(d.heal, p.max - p.hp) * 7;
    if (d.healDice) s += Math.min(4, p.max - p.hp) * 7;
    if (d.dmgReverse) s += 10;
    if (diff === 'hard'){                    // 困难：预测对手下回合爆发 + 历史爆发
      var oppPot = dmgPotential(f, p);       // 读对手当前手牌估潜在伤害
      if (typeof G !== 'undefined' && G && G.log){
        var fSeat = (f === G.players.me) ? 'me' : 'opp';
        oppPot = Math.max(oppPot, (G.log[fSeat] && G.log[fSeat].dmg) || 0);
      }
      if ((p.hp + p.shield) <= oppPot){      // 撑不住 → 防守优先
        if (d.block) s += 30;
        if (d.heal)  s += Math.min(d.heal, p.max - p.hp) * 8;
      }
    }
    return s;
  }
  // 掷骰：有被动「千术」时，1/2/3 的概率降到 30%（其余 70% 给 4/5/6）
  function rollDie(p){
    if (p && p.passiveGambler){
      return (Math.random() < 0.30) ? (1 + Math.floor(Math.random()*3)) : (4 + Math.floor(Math.random()*3));
    }
    return 1 + Math.floor(Math.random()*6);
  }
  // 赌徒·千术：两颗骰子点数相同的概率减半（相同时，五成概率重掷其一）
  function luckDice(faces){
    if (!faces || faces.length < 2) return faces;
    if (faces[0] === faces[1] && Math.random() < 0.5){
      var v; do { v = 1 + Math.floor(Math.random()*6); } while (v === faces[0]);
      faces[1] = v;
    }

  function aiChoose(p, f){
    var diff = (typeof G !== 'undefined' && G && G.difficulty) || 'normal';
    // 困难：以 aiScore 的威胁评估为准；推演搜索(hardChoose)实测不如贪心，默认关闭
    if (diff === 'easy'){                              // 简单：只看表面、有时乱出、有时收手
      var playable = [];
      for (var i=0;i<p.hand.length;i++){ if (DEFS[p.hand[i].key].cost <= p.ap) playable.push(i); }
      if (!playable.length) return -1;
      if (Math.random() < 0.30) return -1;
      if (Math.random() < 0.45) return playable[Math.floor(Math.random()*playable.length)];
      var eb=-1, ebs=0;
      for (var j=0;j<p.hand.length;j++){ var cc=p.hand[j], dd=DEFS[cc.key]; if (dd.cost>p.ap) continue; var s2=aiScore(cc,p,f); if (s2>ebs){ebs=s2;eb=j;} }
      return eb<0 ? playable[0] : eb;
    }
    var canLethal = dmgPotential(p, f) >= f.hp;         // 本回合伤害够了 → 全力输出
    var best = -1, bestScore = 0;
    for (var k=0;k<p.hand.length;k++){
      var c = p.hand[k], d = DEFS[c.key];
      if (d.cost > p.ap) continue;
      var s;
      if (canLethal && !d.passive){
        if (!(d.dmg || d.buff)) continue;               // 斩杀模式：只出能推进伤害的牌
        s = (d.buff ? 260 : 0) + effDamage(d, p, f) * 10 + 50;
      } else {
        s = aiScore(c, p, f);
      }
      if (s > bestScore){ bestScore = s; best = k; }
    }
    if (best < 0) return -1;
    if (!canLethal && bestScore < 7) return -1;         // 没得赚就收手
    return best;
  }
  function aiTurn(){ if (!G.over && G.turn==='opp' && G.phase==='play') aiStep(0); }
  function aiStep(depth){
    if (G.over || G.turn!=='opp' || G.phase!=='play') return;
    if (busy){ setTimeout(function(){ aiStep(depth); }, 200); return; }
    if (depth > 14){ endTurnInternal('opp'); return; }
    var idx = aiChoose(G.players.opp, G.players.me);
    if (idx < 0){
      setTimeout(function(){ if (!G.over && G.turn==='opp' && G.phase==='play' && !busy) endTurnInternal('opp'); }, 600);
      return;
    }
    playCard('opp', idx);
    setTimeout(function(){ aiStep(depth+1); }, 720);
  }
  function aiDiscard(){
    if (G.over || G.phase!=='discard' || G.turn!=='opp') return;
    var p = G.players.opp;
    if (p.hand.length <= 4){ G.phase='play'; passTurn('opp'); return; }
    var worst = 0, ws = Infinity;
    for (var i=0;i<p.hand.length;i++){
      var s = aiScore(p.hand[i], p, G.players.me);
      if (s < ws){ ws = s; worst = i; }
    }
    log('对手手牌超上限，弃掉一张');
    discardCard('opp', worst);
    setTimeout(aiDiscard, 420);
  }

    tmShake(boss,'attack');
    table.classList.remove('quake'); void table.offsetWidth; table.classList.add('quake');
    setTimeout(function(){ table.classList.remove('quake'); }, 520);
    projSet('rock');
    var i = 0;
    (function step(){
      if (TM.over || i >= players.length){ projSet(null); if (cb) cb(); return; }
      var t = players[i++];
      tmFireArc(boss.av, TM.comb[t].av, 520, true, function(){ tmHit(bi, t, dmg, !!pierce); setTimeout(step, 150); });
    })();
  }
  function tmBossTurn(){
    if (!TM || TM.over) return;
    var bi = TM.order[TM.ti], boss = TM.comb[bi];
    if (!boss || boss.dead || !boss.isBoss) return;
    var players = [];
    for (var i=0;i<TM.n;i++){ var p=TM.comb[i]; if (p.team===0 && !p.dead) players.push(i); }
    var finish = function(){ tmRender(); if (!TM.over) tmEndTurn(bi); };
    if (boss.skipNext){
      boss.skipNext = false;
      log('巨人喘了口气……');
      tmFloat(boss,'…','gain');
      tmRender();
      setTimeout(finish, 520);
      return;
    }
    var sk = BOSS_SKILLS[boss.skillIdx % BOSS_SKILLS.length];
    boss.skillIdx++;
    var rage = (boss.hp <= boss.max/2) ? 3 : 0;   // 被动·狂暴
    var justRaged = rage && !boss.rageOn;
    if (justRaged) boss.rageOn = true;
    log('巨人 施放 ' + sk.name + (rage && sk.dmg ? '（狂暴 +3）' : ''));
    if (justRaged){ tmFloat(boss,'狂暴！','fire'); setTimeout(function(){ log('巨人进入狂暴状态——所有技能伤害 +3！'); }, 30); }
    if (DEFS[sk.key]) showPlayed(sk.key);
    tmRender();
    if (!players.length){ finish(); return; }
    if (sk.kind === 'self'){
      tmShake(boss,'attack');
      setTimeout(function(){ boss.shield = boss.shield + (sk.block||0); tmShieldFx(boss,'gain'); tmFloat(boss,'+'+sk.block+'盾','gain'); finish(); }, 320);
      return;
    }
    if (sk.kind === 'single'){
      var t = players[Math.floor(Math.random()*players.length)];
      projSet('rock');
      tmShake(boss,'attack');
      tmFireArc(boss.av, TM.comb[t].av, 560, true, function(){
        tmHit(bi, t, sk.dmg + rage, false);
        if (!TM.over && sk.weak && !TM.comb[t].dead){ TM.comb[t].weak = (TM.comb[t].weak||0) + sk.weak; tmFloat(TM.comb[t],'虚弱','fire'); }
        projSet(null); finish();
      });
      return;
    }
    var extras = function(){
      var j;
      if (sk.heal && !TM.over) tmHeal(boss, sk.heal);
      if (sk.burn && !TM.over){ for (j=0;j<players.length;j++){ var q=TM.comb[players[j]]; if (!q.dead){ q.burn=(q.burn||0)+sk.burn; tmFloat(q,'灼烧 '+sk.burn,'fire'); } } }
      if (sk.skip) boss.skipNext = true;
      finish();
    };
    var dmg = sk.dmg ? (sk.dmg + rage) : 0;
    if (!dmg){ tmShake(boss,'attack'); table.classList.remove('quake'); void table.offsetWidth; table.classList.add('quake'); setTimeout(function(){ table.classList.remove('quake'); }, 520); setTimeout(extras, 420); return; }
    tmBossAoe(bi, players, dmg, sk.pierce, extras);
  }

  function tmDrawAll(){                          // 大回合开始：所有非-BOSS 存活者一起抽牌
    if (!TM) return;
    for (var k=0;k<TM.n;k++){ var p=TM.comb[k];
      if (p.isBoss || p.dead) continue;
      var n = Math.max(0, 3 - (p.drawPenalty||0)); p.drawPenalty = 0; tmDraw(p, n);
    }
  }
  function tmStartTurn(i){
    if (!TM || TM.over) return;
    var c = TM.comb[i];
    if (c.isBoss){
      c.ap = 0;
      tmHint('巨人的回合……');
      tmRender();
      setTimeout(tmBossTurn, 760);
      return;
    }
    var rd = (i === TM.order[0]);
    if (rd) tmDrawAll();
    c.ap = Math.max(0, (c.baseAp||3) - (c.apPenalty||0)); c.apPenalty = 0;
    c.lifestealOn = !!(c.passiveLifesteal && c.hp < c.max/2);
    log('第 '+TM.round+' 回合'+(rd?'开始 · 全员抽牌':'')+' · ' + c.name + '（' + getChar(c.charId).name + '）的半回合');
    tmHint(i===0 ? '你的半回合：点手牌出牌' : '');
    tmRender();
    if (i !== 0) setTimeout(tmAiTurn, 700);
  }
  function tmEndTurn(i){
    if (!TM || TM.over) return;
    var c = TM.comb[i];
    if (c.burn>0 && !c.dead){ var v=Math.max(1,Math.round(c.hp*0.10)), b=c.hp; c.hp=Math.max(0,c.hp-v); c.dmgTaken+=(b-c.hp); tmFloat(c,'灼烧 -'+(b-c.hp),'fire'); if (c.hp<=0){ c.dead=true; tmFall(c); } c.burn--; }
    c.dmgBuff = 0; if (c.weak>0) c.weak--;
    tmCheckWin(); tmRender();
    if (TM.over) return;
    if (c.hand.length > 4){
      if (i === 0){                                   // 玩家手动弃牌
        TM.phase = 'discard'; TM.discSi = 0;
        tmHint('手牌超过上限 4，点击手牌弃牌（弃到 4 张）');
        log('你的手牌 '+c.hand.length+' 张，超过上限 4，请点击弃牌');
        tmRender();
        return;
      }
      while (c.hand.length > 4){ var wi=0,ws=Infinity; for (var k=0;k<c.hand.length;k++){ var s=aiScore(c.hand[k],c,c); if (s<ws){ws=s;wi=k;} } tmOwnerPush(c.hand.splice(wi,1)[0], i); }
      tmRender();
    }
    tmAdvance(i);
  }
  function tmAdvance(i){
    if (!TM || TM.over) return;
    TM.phase = 'play'; tmHint('');
    TM.ti = (TM.ti + 1) % TM.order.length;
    if (TM.ti === 0) tmRoundEnd();
    if (!TM.over) tmStartTurn(TM.order[TM.ti]);
  }
  function tmDiscard(si, idx){
    if (!TM || TM.over || TM.phase !== 'discard' || si !== TM.discSi) return;
    var c = TM.comb[si]; if (!c) return;
    var card = c.hand.splice(idx,1)[0]; if (!card) return;
    tmOwnerPush(card, si);
    log('你弃掉一张牌');
    if (c.hand.length <= 4){ TM.phase = 'play'; tmHint(''); tmAdvance(si); }
    else { tmRender(); }
  }
  function tmRoundEnd(){
    TM.round++;
    for (var i=0;i<TM.n;i++){ var c=TM.comb[i];
      if (!c.dead && c.lifeLoss>0){ var v=c.lifeLoss; c.lifeLoss=0; var b=c.hp; c.hp=Math.max(0,c.hp-v); c.dmgTaken+=(b-c.hp); tmFloat(c,'生命损失 -'+(b-c.hp),'fire'); if (c.hp<=0){ c.dead=true; tmFall(c); } }
    }
    tmCheckWin();
  }
  function tmHighlightTargets(on){
    if (!TM) return;
    var en = tmAliveEnemies(0);
    for (var i=0;i<TM.n;i++) TM.comb[i].av.classList.remove('tm-target');
    if (on) en.forEach(function(i){ TM.comb[i].av.classList.add('tm-target'); });
  }
  function tmCardClick(idx){
    if (!TM || TM.over || TM.order[TM.ti] !== 0 || TM.targeting >= 0) return;
    var me = TM.comb[0], c = me.hand[idx]; if (!c) return;
    var d = DEFS[c.key]; if (d.cost > me.ap) return;
    var en = tmAliveEnemies(0);
    var needs = !!(d.dmg || d.lifeloss || d.weak || d.swap || d.disrupt || d.lifelossDiceDiff || d.dmgReverse || d.debuff==='burn');
    if (needs && en.length > 1){ TM.targeting = idx; tmHighlightTargets(true); tmHint('点一个敌人指定攻击目标（再点卡片取消）'); tmRender(); }
    else if (needs && en.length === 1){ tmPlayCard(0, idx, en[0]); }
    else { tmPlayCard(0, idx, -1); }
  }
  function tmAvatarClick(i){
    if (!TM || TM.over) return;
    if (TM.targeting >= 0 && TM.order[TM.ti]===0){
      var en = tmAliveEnemies(0);
      if (en.indexOf(i) >= 0){ var idx = TM.targeting; tmPlayCard(0, idx, i); }
      else { TM.targeting=-1; tmHighlightTargets(false); tmHint(''); tmRender(); }
    }
  }

  /* ================= 选角 ================= */
  var selId = null;
  function renderSelect(q){
    var grid = document.getElementById('charGrid');
    var kw = (q||'').trim().toLowerCase();
    var list = CHARACTERS.filter(function(ch){ if (!kw) return true; return ((ch.name||'')+(ch.tag||'')+(ch.desc||'')).toLowerCase().indexOf(kw) >= 0; });
    grid.innerHTML = list.map(function(ch){
      return '<div class="charcard'+(ch.id===selId?' sel':'')+'" data-id="'+ch.id+'">'+
        '<div class="charart" style="--main:'+ch.main+';--main-dark:'+ch.dark+'">'+bodyHTML(ch.body)+'</div>'+
        '<div class="charname">'+ch.name+'</div><div class="chartag">'+ch.tag+'</div>'+
        '<div class="chardesc">'+ch.desc+'</div></div>';
    }).join('') || '<div class="chardesc" style="padding:20px">没有匹配的职业</div>';
  }
  document.getElementById('charSearch').addEventListener('input', function(){ renderSelect(this.value); });
  function renderDeckPreviewPlaceholder(){}
  document.getElementById('charGrid').addEventListener('click', function(e){
    var el = e.target.closest('.charcard'); if (!el) return;
    selId = el.dataset.id;
    document.querySelectorAll('.charcard').forEach(function(c){ c.classList.toggle('sel', c.dataset.id===selId); });
    document.getElementById('startBtn').disabled = false;
    document.getElementById('viewDeckBtn').disabled = false;
  });
  document.getElementById('viewDeckBtn').addEventListener('click', function(){ if (selId) openDeckModal(getChar(selId)); });
  function openDeckModal(ch){
    var counts = {}, order = [];
    ch.deck.forEach(function(k){ if (!counts[k]) order.push(k); counts[k] = (counts[k]||0) + 1; });
    document.getElementById('dmTitle').textContent = ch.name + ' · 卡组（共 12 张）';
    document.getElementById('dmGrid').innerHTML = order.map(function(k){
      var d = DEFS[k];
      return '<div class="mini '+d.cls+'"><span class="cc">'+d.cost+'</span><div class="cn">'+d.name+'</div>'+
             '<div class="ca">'+d.face+'</div><div class="ce">'+d.text+'</div><span class="cnt">×'+counts[k]+'</span></div>';
    }).join('');
    document.getElementById('deckModal').classList.add('on');
  }
  document.getElementById('dmClose').addEventListener('click', function(){ document.getElementById('deckModal').classList.remove('on'); });


  function groupCards(arr){
    var c = {}, o = [];
    arr.forEach(function(x){ var k=x.key; if (!(k in c)){ c[k]=0; o.push(k); } c[k]++; });
    return o.map(function(k){ return { k:k, n:c[k] }; });
  }
  function miniCard(k, n){
    var d = DEFS[k];
    return '<div class="mini '+d.cls+'"><span class="cc">'+d.cost+'</span><div class="cn">'+d.name+'</div>'+
           '<div class="ca">'+d.face+'</div><div class="ce">'+d.text+'</div><span class="cnt">×'+n+'</span></div>';
  }
  function renderPile(){
    var me = G.players.me, op = G.players.opp;
    var h = '';
    var deck = groupCards(me.deck), hand = groupCards(me.hand);
    h += '<div class="dstitle">你的牌堆（未抽 '+me.deck.length+' 张）</div><div class="dm-grid">'+ (deck.length? deck.map(function(it){ return miniCard(it.k,it.n); }).join('') : '<span style="color:#8ea2b4">（空）</span>') +'</div>';
    h += '<div class="dstitle">你的手牌（'+me.hand.length+' 张）</div><div class="dm-grid">'+ (hand.length? hand.map(function(it){ return miniCard(it.k,it.n); }).join('') : '<span style="color:#8ea2b4">（空）</span>') +'</div>';
    if (me.field.length) h += '<div class="dstitle">场上（被动）</div><div class="dm-grid">'+ me.field.map(function(c){ var d=DEFS[c.key]; return '<div class="mini '+d.cls+'"><span class="cc">'+d.cost+'</span><div class="cn">'+d.name+'</div><div class="ca">'+d.face+'</div><div class="ce">'+d.text+'</div></div>'; }).join('') +'</div>';
    h += '<div class="dstitle">对手：手牌 '+op.hand.length+' 张 · 牌堆 '+op.deck.length+' 张</div>';
    document.getElementById('pmBody').innerHTML = h;
  }
  function renderPileTeam(){
    if (!TM) return;
    var me = TM.comb[0], h = '';
    h += '<div class="dstitle">你 · 牌堆（未抽 '+me.deck.length+' 张）</div><div class="dm-grid">'+(groupCards(me.deck).map(function(it){return miniCard(it.k,it.n);}).join('')||'<span style="color:#8ea2b4">（空）</span>')+'</div>';
    h += '<div class="dstitle">你 · 手牌（'+me.hand.length+' 张）</div><div class="dm-grid">'+(groupCards(me.hand).map(function(it){return miniCard(it.k,it.n);}).join('')||'<span style="color:#8ea2b4">（空）</span>')+'</div>';
    h += '<div class="dstitle">其余参战者</div>';
    for (var i=1;i<TM.n;i++){ var c=TM.comb[i]; h += '<div class="statrow"><span>'+c.name+' · '+tmCharOf(c).name+'</span><span>手牌 '+c.hand.length+' · 牌堆 '+c.deck.length+' · '+(c.dead?'已倒下':c.hp+'/'+c.max)+'</span></div>'; }
    document.getElementById('pmBody').innerHTML = h;
  }
  document.getElementById('pmClose').addEventListener('click', function(){ document.getElementById('pileModal').classList.remove('on'); });
  document.getElementById('drawpile').addEventListener('click', function(){ if (TM) renderPileTeam(); else renderPile(); document.getElementById('pileModal').classList.add('on'); });

  document.getElementById('diffRow').addEventListener('click', function(e){
    var el = e.target.closest('.diffbtn'); if (!el) return;
    chosenDiff = el.dataset.diff;
    document.querySelectorAll('.diffbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.diff===chosenDiff); });
  });
  document.getElementById('modeRow').addEventListener('click', function(e){
    var el = e.target.closest('.diffbtn'); if (!el) return;
    chosenMode = el.dataset.mode;
    document.querySelectorAll('#modeRow .diffbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.mode===chosenMode); });
    renderOppRow();
  });

  /* ---- 1v1 对手：随机 / 选择 ---- */
  var oppChosen = null;
  function renderOppRow(){
    var row = document.getElementById('oppRow'); if (!row) return;
    row.style.display = (chosenMode === 'single') ? 'flex' : 'none';
    var nm = document.getElementById('oppName'), fc = document.getElementById('oppFace');
    if (!oppChosen){ nm.textContent = '随 机'; fc.innerHTML = ''; return; }
    var ch = getChar(oppChosen);
    nm.textContent = ch.name;
    fc.innerHTML = '<div class="charart" style="width:100%;height:100%;margin:0;--main:'+ch.main+';--main-dark:'+ch.dark+'">'+bodyHTML(ch.body)+'</div>';
  }
  function renderOppGrid(){
    document.getElementById('oppGrid').innerHTML = CHARACTERS.map(function(ch){
      return '<div class="charcard'+(ch.id===oppChosen?' sel':'')+'" data-id="'+ch.id+'">'+
        '<div class="charart" style="--main:'+ch.main+';--main-dark:'+ch.dark+'">'+bodyHTML(ch.body)+'</div>'+
        '<div class="charname">'+ch.name+'</div><div class="chartag">'+ch.tag+'</div></div>';
    }).join('');
  }
  document.getElementById('oppRandomBtn').addEventListener('click', function(){
    oppChosen = CHARACTERS[Math.floor(Math.random()*CHARACTERS.length)].id;
    renderOppRow();
  });
  document.getElementById('oppPickBtn').addEventListener('click', function(){
    renderOppGrid(); document.getElementById('oppModal').classList.add('on');
  });
  document.getElementById('oppClose').addEventListener('click', function(){ document.getElementById('oppModal').classList.remove('on'); });
  document.getElementById('oppGrid').addEventListener('click', function(e){
    var el = e.target.closest('.charcard'); if (!el) return;
    oppChosen = el.dataset.id;
    document.getElementById('oppModal').classList.remove('on');
    renderOppRow();
  });
  document.getElementById('startBtn').addEventListener('click', function(){
    if (!selId) return;
    chosenMe = selId;
    var pick = oppChosen ? getChar(oppChosen) : CHARACTERS[Math.floor(Math.random()*CHARACTERS.length)];
    chosenOpp = pick.id;
    document.getElementById('select').classList.remove('on');
    if (chosenMode === 'team'){
      tmStart();
    } else if (chosenMode === 'boss'){
      tmStartBoss();
    } else {
      TM = null;
      table.classList.remove('team','bossmode');
      document.getElementById('teamLayer').classList.remove('on');
      reset();
      log((oppChosen ? '对手选定：' : '对手随机选中：')+pick.name+' —— 对局开始！');
    }
  });
  document.getElementById('reselectBtn').addEventListener('click', function(){
    document.getElementById('banner').classList.remove('on');
    renderSelect();
    document.getElementById('select').classList.add('on');
  });

  renderSelect();
  renderOppRow();
</script>

if (location.protocol === "http:" || location.protocol === "https:") {
  window.addEventListener("load", function(){ try { navigator.serviceWorker.register("sw.js").then(function(r){ r.update(); }); } catch(e){} });
}
</script>
