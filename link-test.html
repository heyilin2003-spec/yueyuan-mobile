<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>月圆之夜 · 联机（房间号）</title>
<style>
  :root{ --bg:#0b1020; --panel:#141a30; --line:#2a3358; --txt:#e8ecff; --dim:#8b95c4; --acc:#7aa2ff; --ok:#4ade80; --bad:#ff6b6b; --warn:#f6c445; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 -apple-system,"PingFang SC",sans-serif; padding:16px 14px 40px; }
  h1{ font-size:18px; margin:0 0 4px; }
  .sub{ color:var(--dim); font-size:13px; margin:0 0 14px; }
  #status{ position:sticky; top:0; z-index:9; background:var(--panel); border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; margin-bottom:14px; font-weight:600; }
  #status.on{ border-color:var(--ok); color:var(--ok); }
  #status.warn{ border-color:var(--warn); color:var(--warn); }
  #note{ display:none; background:#1c2a1e; border:1px solid var(--ok); color:var(--ok); border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:13.5px; }
  #note.warn{ background:#2a2413; border-color:var(--warn); color:var(--warn); }
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:720px){ .cols{ grid-template-columns:1fr; } }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .card h2{ font-size:15px; margin:0 0 8px; }
  .card p{ color:var(--dim); font-size:12.5px; margin:0 0 8px; }
  .warnbox{ background:#241d10; border:1px solid #5a4a1c; color:var(--warn); border-radius:8px; padding:8px 10px; font-size:12.5px; margin:8px 0 4px; }
  button{ width:100%; background:var(--acc); color:#08122b; border:0; border-radius:9px; padding:12px; font:600 15px/1 inherit; margin:4px 0; cursor:pointer; transition:transform .06s; }
  button:active{ transform:scale(.98); }
  button.ghost{ background:transparent; color:var(--acc); border:1px solid var(--line); }
  button:disabled{ opacity:.5; }
  input{ width:100%; background:#0a0f1e; color:var(--txt); border:1px solid var(--line); border-radius:9px; padding:12px; font:600 22px/1 ui-monospace,Menlo,monospace; text-align:center; letter-spacing:6px; margin:4px 0; }
  .roomNo{ font:700 44px/1.2 ui-monospace,Menlo,monospace; letter-spacing:10px; text-align:center; color:var(--ok); margin:10px 0 6px; text-indent:10px; }
  #log{ margin-top:14px; background:#070b16; border:1px solid var(--line); border-radius:10px; padding:10px; height:160px; overflow:auto; font:12px/1.5 ui-monospace,Menlo,monospace; color:var(--dim); white-space:pre-wrap; }
  .hint{ color:var(--dim); font-size:12px; margin-top:10px; }
  .row{ display:flex; gap:8px; }
  .row button{ margin:4px 0; }
  #toast{ position:fixed; left:50%; top:50%; transform:translate(-50%,-40%); background:#1b2544; border:1.5px solid var(--acc); color:var(--txt);
          padding:14px 20px; border-radius:14px; font:600 15px/1.4 -apple-system,"PingFang SC",sans-serif; z-index:99; max-width:84vw; text-align:center;
          opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  #toast.show{ opacity:1; transform:translate(-50%,-50%) scale(1.02); }
  #toast.ok{ border-color:var(--ok); }
  #toast.bad{ border-color:var(--bad); }
</style>
</head>
<body>
<h1>月圆之夜 · 联机（房间号）</h1>
<p class="sub">零依赖 · 只用免费公共中继交换握手，游戏数据点对点直连。</p>

<div id="status">未连接 · 先创建房间或输入房间号</div>
<div id="note"></div>

<div class="cols">
  <div class="card" id="hostCard">
    <h2>① 房主（发起方）</h2>
    <p>点「创建房间」，把这 4 位数报给朋友（打字/念都行）。</p>
    <button id="hCreate">创建房间</button>
    <div id="hRoomBox" style="display:none">
      <div class="roomNo" id="hRoomNo">----</div>
      <button class="ghost" id="hCopyRoom">复制房间号</button>
    </div>
    <div class="warnbox">朋友输入房间号后会自动连上。切到微信发号码没关系；就算页面被回收、重新打开，也会自动用同一个房间号连回来。</div>
    <button class="ghost" id="showGuest" style="margin-top:10px">📥 我是客人，要加入朋友的房间</button>
  </div>

  <div class="card" id="guestCard" style="display:none">
    <h2>② 客人（加入方）</h2>
    <p>输入房主给你的 4 位数房间号。</p>
    <input id="gRoom" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="房间号" autocomplete="off">
    <button id="gJoin">加入房间</button>
    <div class="warnbox">加入后会自动握手。如果房主那边看到你进来了，就说明通了。</div>
  </div>
</div>

<div class="row" style="margin-top:12px">
  <button class="ghost" id="sendPing">发送测试消息</button>
</div>
<div id="log"></div>
<p class="hint">房间号会记在本机，重进自动重连。</p>
<div id="toast"></div>

<script>
/* ================= 极简 MQTT over WebSocket（零依赖） ================= */
const cat = arrs => { let n=0; for(const a of arrs) n+=a.length; const o=new Uint8Array(n); let p=0; for(const a of arrs){ o.set(a,p); p+=a.length; } return o; };
const u16 = n => new Uint8Array([(n>>8)&255, n&255]);
const enc8 = s => { const b = new TextEncoder().encode(s); return cat([u16(b.length), b]); };

class MiniMqtt {
  constructor(url, clientId){ this.url=url; this.clientId=clientId; this.ws=null; this.buf=new Uint8Array(0);
    this.connected=false; this.pid=1; this.onmsg=null; this.onclose=null; this._keep=null; }
  _pkt(type, flags, payload){
    const rl=[]; let n=payload.length;
    do { let b=n%128; n=Math.floor(n/128); if(n>0) b|=128; rl.push(b); } while(n>0);
    return cat([new Uint8Array([(type<<4)|flags]), new Uint8Array(rl), payload]);
  }
  connect(){
    return new Promise((res,rej)=>{
      let ws; try{ ws=new WebSocket(this.url,['mqtt']); }catch(e){ return rej(new Error('无法连接中继')); }
      ws.binaryType='arraybuffer'; this.ws=ws;
      let settled=false;
      const to=setTimeout(()=>{ if(!settled){ settled=true; try{ws.close();}catch{}; rej(new Error('连接中继超时（网络不通或被防火墙挡了）')); } }, 12000);
      ws.onopen=()=>{ const vh=cat([enc8('MQTT'), new Uint8Array([4,0x02]), u16(60)]); ws.send(this._pkt(1,0,cat([vh, enc8(this.clientId)]))); };
      ws.onmessage=ev=>{ this._feed(new Uint8Array(ev.data)); if(this.connected && !settled){ settled=true; clearTimeout(to); res(); } };
      ws.onerror=()=>{ if(!settled){ settled=true; clearTimeout(to); rej(new Error('中继连接失败')); } };
      ws.onclose=()=>{ this.connected=false; if(this.onclose) this.onclose(); };
      this._keep=setInterval(()=>{ if(this.connected && this.ws && this.ws.readyState===1){ try{ this.ws.send(this._pkt(12,0,new Uint8Array(0))); }catch{} } }, 40000);
    });
  }
  _feed(b){
    this.buf=cat([this.buf,b]);
    while(this.buf.length>=2){
      const type=this.buf[0]>>4;
      let mult=1,len=0,i=1,byte;
      while(true){ if(i>=this.buf.length) return; byte=this.buf[i++]; len+=(byte&127)*mult; mult*=128; if(!(byte&128)) break; }
      if(this.buf.length < i+len) return;
      const pl=this.buf.slice(i,i+len); this.buf=this.buf.slice(i+len);
      this._h(type, pl);
    }
  }
  _h(type, pl){
    if(type===2){ if(pl.length>=2 && pl[1]===0) this.connected=true; else if(this.onclose) this.onclose(new Error('中继拒绝连接')); return; }
    if(type===3){ const tl=(pl[0]<<8)|pl[1];
      const topic=new TextDecoder().decode(pl.slice(2,2+tl));
      const msg=new TextDecoder().decode(pl.slice(2+tl));
      if(this.onmsg) this.onmsg(topic,msg); }
  }
  subscribe(topic){ const b=new TextEncoder().encode(topic); this.ws.send(this._pkt(8,2,cat([u16(this.pid++), u16(b.length), b, new Uint8Array([0])]))); }
  publish(topic, msg){ const b=new TextEncoder().encode(topic); const m=new TextEncoder().encode(msg); this.ws.send(this._pkt(3,0,cat([u16(b.length), b, m]))); }
  close(){ try{ this.ws && this.ws.send(this._pkt(14,0,new Uint8Array(0))); this.ws && this.ws.close(); }catch{} clearInterval(this._keep); }
}
/* ==================================================================== */

const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const PREFIX = 'yygame-luna-7f2c';
const ICE = { iceServers: [
  { urls: 'stun:stun.miwifi.com:3478' },
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
]};
const LS = { room:'yy_room', role:'yy_role' };
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(m){ logEl.textContent += `[${new Date().toLocaleTimeString()}] ${m}\n`; logEl.scrollTop = logEl.scrollHeight; }
function setStatus(t, cls){ const s=$('status'); s.textContent=t; s.className=cls||''; }
function note(msg, warn){ const n=$('note'); if(msg){ n.textContent=msg; n.style.display='block'; n.className=warn?'warn':''; } else n.style.display='none'; }
function save(k,v){ try{ v?localStorage.setItem(k,v):localStorage.removeItem(k); }catch{} }
function load(k){ try{ return localStorage.getItem(k); }catch{ return null; } }
const rand = () => Math.random().toString(36).slice(2,10);
let toastTimer;
function toast(msg, type){ const t=$('toast'); t.textContent=msg; t.className='show'+(type?' '+type:'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.className=''; }, type==='bad'?3400:2200); }
function busy(btn,text,fn){ return async()=>{ const o=btn.textContent; btn.disabled=true; btn.textContent=text; try{ await fn(); } finally{ btn.disabled=false; btn.textContent=o; } }; }

const b64e = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c=>c.charCodeAt(0));
async function enc(obj){
  const json = JSON.stringify(obj);
  if(typeof CompressionStream === 'undefined') return 'raw:'+b64e(new TextEncoder().encode(json));
  const cs=new CompressionStream('gzip'); const w=cs.writable.getWriter();
  w.write(new TextEncoder().encode(json)); w.close();
  return 'gz:'+b64e(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
}
async function dec(code){
  code=(code||'').trim().replace(/\s+/g,'');
  if(!code) throw new Error('内容为空');
  let obj;
  if(code.startsWith('raw:')) obj=JSON.parse(new TextDecoder().decode(b64d(code.slice(4))));
  else if(code.startsWith('gz:')){
    if(typeof DecompressionStream==='undefined') throw new Error('浏览器太旧，不支持解压');
    const ds=new DecompressionStream('gzip'); const w=ds.writable.getWriter();
    w.write(b64d(code.slice(3))); w.close();
    obj=JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()));
  } else throw new Error('码格式不对');
  if(!obj || typeof obj!=='object' || !obj.type) throw new Error('码无效');
  return obj;
}
function waitIce(p){
  if(p.iceGatheringState==='complete') return Promise.resolve();
  return new Promise(res=>{ let d=false; const fin=()=>{ if(!d){ d=true; res(); } };
    const t=setTimeout(fin,4000);
    p.addEventListener('icegatheringstatechange',()=>{ if(p.iceGatheringState==='complete'){ clearTimeout(t); fin(); } }); });
}

let mqtt=null, room=null, myRole=null, pc=null, dc=null;
const topicFor = (r,who) => `${PREFIX}/${r}/${who}`; // who: 'h'(房主收) / 'g'(客人收)
function mqttPub(msg){ if(mqtt && room) mqtt.publish(topicFor(room, myRole==='host'?'g':'h'), JSON.stringify(msg)); }
function mqttSub(){ if(mqtt && room) mqtt.subscribe(topicFor(room, myRole==='host'?'h':'g')); }

function updateStatus(){
  if(dc && dc.readyState==='open'){ setStatus('已连接 ✅（'+(myRole==='host'?'房主':'客人')+'）','on'); return; }
  if(pc){ setStatus('正在连接对方…'); return; }
  if(mqtt && mqtt.connected && room && myRole==='host'){ setStatus('房间 '+room+' 已创建，等待朋友加入…'); return; }
  if(mqtt && mqtt.connected && room && myRole==='guest'){ setStatus('正在加入房间 '+room+'…'); return; }
  setStatus('未连接 · 先创建房间或输入房间号','warn');
}
function setupDC(){
  dc.onopen = () => { updateStatus(); note(''); toast('🎉 已连接！通道打通','ok'); log((myRole==='host'?'房主':'客人')+' 数据通道已打开'); dc.send('hello from '+myRole); };
  dc.onclose = () => { updateStatus(); toast('⚠️ 连接已断开','bad'); log('数据通道关闭'); };
  dc.onerror = e => log('数据通道错误: '+(e.message||e));
  dc.onmessage = e => { log('收到: '+e.data); if(e.data==='ping') dc.send('pong from '+myRole); };
}

async function hostCreateRoom(r){
  myRole='host'; room=r; save(LS.room,r); save(LS.role,'host');
  $('hRoomNo').textContent=r; $('hRoomBox').style.display='';
  if(mqtt){ try{ mqtt.close(); }catch{} mqtt=null; }
  updateStatus();
  log('正在连接中继…');
  mqtt = new MiniMqtt(BROKER, 'yh-'+r+'-'+rand());
  mqtt.onmsg = hostOnMsg;
  mqtt.onclose = () => { log('中继断开'); updateStatus(); };
  await mqtt.connect();
  mqttSub();
  updateStatus();
  log('房间 '+r+' 已创建，等待朋友加入…');
  toast('✅ 房间已创建：'+r,'ok');
  mqttPub({t:'host-hello'});
}
async function hostOnMsg(topic, msg){
  let m; try{ m=JSON.parse(msg); }catch{ return; }
  log('收到: '+m.t);
  if(m.t==='join'){ await hostSendOffer(); }
  else if(m.t==='answer'){
    try{ await pc.setRemoteDescription(await dec(m.sdp)); updateStatus(); log('已收到应答，等待通道打开…'); }
    catch(e){ log('应用应答失败: '+e.message); toast('❌ '+e.message,'bad'); }
  }
}
async function hostSendOffer(){
  if(pc){ try{ pc.close(); }catch{} }
  pc = new RTCPeerConnection(ICE);
  pc.onconnectionstatechange = () => { updateStatus(); log('房主连接态: '+pc.connectionState); };
  dc = pc.createDataChannel('game', { ordered:true });
  setupDC();
  await pc.setLocalDescription(await pc.createOffer());
  await waitIce(pc);
  mqttPub({ t:'offer', sdp: await enc(pc.localDescription) });
  log('已发出邀请，等待对方应答…');
  updateStatus();
}

async function guestJoin(r){
  myRole='guest'; room=r; save(LS.room,r); save(LS.role,'guest');
  if(mqtt){ try{ mqtt.close(); }catch{} mqtt=null; }
  updateStatus();
  log('正在连接中继…');
  mqtt = new MiniMqtt(BROKER, 'yg-'+r+'-'+rand());
  mqtt.onmsg = guestOnMsg;
  mqtt.onclose = () => { log('中继断开'); updateStatus(); };
  await mqtt.connect();
  mqttSub();
  mqttPub({ t:'join' });
  updateStatus();
  log('已请求加入房间 '+r+'，等待房主…');
  toast('已请求加入房间 '+r,'ok');
}
async function guestOnMsg(topic, msg){
  let m; try{ m=JSON.parse(msg); }catch{ return; }
  log('收到: '+m.t);
  if(m.t==='offer'){
    if(pc){ try{ pc.close(); }catch{} }
    pc = new RTCPeerConnection(ICE);
    pc.onconnectionstatechange = () => { updateStatus(); log('客人连接态: '+pc.connectionState); };
    pc.ondatachannel = e => { dc=e.channel; setupDC(); };
    try{
      await pc.setRemoteDescription(await dec(m.sdp));
      await pc.setLocalDescription(await pc.createAnswer());
      await waitIce(pc);
      mqttPub({ t:'answer', sdp: await enc(pc.localDescription) });
      log('已回传应答，等待通道打开…'); updateStatus();
    }catch(e){ log('处理邀请失败: '+e.message); toast('❌ '+e.message,'bad'); }
  } else if(m.t==='host-hello'){
    if(!(dc && dc.readyState==='open')){ mqttPub({t:'join'}); log('房主在线，请求加入…'); }
  }
}

function showGuest(on){
  $('hostCard').style.display = on ? 'none' : '';
  $('guestCard').style.display = on ? '' : 'none';
  if(on) note('输入房主给你的 4 位数房间号，点「加入房间」。');
  updateStatus();
}

// 暴露给自动化测试
window.hostCreateRoom = hostCreateRoom;
window.guestJoin = guestJoin;
window.sendMsg = m => { if(dc && dc.readyState==='open'){ dc.send(m); return 'sent'; } return 'not-open'; };
window.dcState = () => dc ? dc.readyState : 'none';
window.roomState = () => ({ role: myRole, room, mqtt: mqtt ? mqtt.connected : false, pc: pc ? pc.connectionState : null, dc: dc ? dc.readyState : null });

// ---- 启动：有号码就自动重连 ----
(function init(){
  const r = load(LS.room), rl = load(LS.role);
  if(rl==='guest' && r){ showGuest(true); $('gRoom').value = r; log('检测到上次房间号，自动重连…'); guestJoin(r).catch(e=>{ log('自动重连失败: '+e.message); }); }
  else if(rl==='host' && r){ $('hRoomNo').textContent = r; $('hRoomBox').style.display=''; log('检测到上次房间号，自动重连…'); hostCreateRoom(r).catch(e=>{ log('自动重连失败: '+e.message); }); }
  updateStatus();
})();

// ---- UI ----
$('hCreate').onclick = busy($('hCreate'), '创建中…', async () => {
  const r = String(Math.floor(1000 + Math.random()*9000));
  note('');
  try{ await hostCreateRoom(r); }catch(e){ log('创建失败: '+e.message); toast('❌ '+e.message,'bad'); }
});
$('hCopyRoom').onclick = async () => {
  try{ await navigator.clipboard.writeText(room); toast('✅ 已复制房间号 '+room,'ok'); }
  catch(e){ toast('房间号是 '+room+'（请手动记下）',''); }
};
$('showGuest').onclick = () => showGuest(true);
$('gJoin').onclick = busy($('gJoin'), '连接中…', async () => {
  const r = ($('gRoom').value||'').replace(/\D/g,'');
  if(!r){ toast('⚠️ 请先输入房间号','bad'); return; }
  note('');
  try{ await guestJoin(r); }catch(e){ log('加入失败: '+e.message); toast('❌ '+e.message,'bad'); }
});
$('sendPing').onclick = () => { const r = sendMsg('ping'); toast(r==='sent' ? '已发送测试消息' : '⚠️ 还没连上，发不出去', r==='sent'?'':'bad'); };
</script>
</body>
</html>
