<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>月圆之夜 · 联机通道测试</title>
<style>
  :root{ --bg:#0b1020; --panel:#141a30; --line:#2a3358; --txt:#e8ecff; --dim:#8b95c4; --acc:#7aa2ff; --ok:#4ade80; --bad:#ff6b6b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 -apple-system,"PingFang SC",sans-serif; padding:16px 14px 40px; }
  h1{ font-size:18px; margin:0 0 4px; }
  .sub{ color:var(--dim); font-size:13px; margin:0 0 14px; }
  #status{ position:sticky; top:0; z-index:9; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:14px; font-weight:600; }
  #status.on{ border-color:var(--ok); color:var(--ok); }
  #status.off{ border-color:var(--bad); color:var(--bad); }
  #note{ display:none; background:#1c2a1e; border:1px solid var(--ok); color:var(--ok); border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:13.5px; }
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:720px){ .cols{ grid-template-columns:1fr; } }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .card h2{ font-size:15px; margin:0 0 8px; }
  .card p{ color:var(--dim); font-size:12.5px; margin:0 0 8px; }
  button{ width:100%; background:var(--acc); color:#08122b; border:0; border-radius:9px; padding:10px; font:600 14px/1 inherit; margin:4px 0; cursor:pointer; }
  button.ghost{ background:transparent; color:var(--acc); border:1px solid var(--line); }
  button:disabled{ opacity:.45; }
  textarea{ width:100%; min-height:72px; background:#0a0f1e; color:var(--txt); border:1px solid var(--line); border-radius:9px; padding:8px; font:12px/1.45 ui-monospace,Menlo,monospace; resize:vertical; margin:4px 0; }
  #log{ margin-top:14px; background:#070b16; border:1px solid var(--line); border-radius:10px; padding:10px; height:170px; overflow:auto; font:12px/1.5 ui-monospace,Menlo,monospace; color:var(--dim); white-space:pre-wrap; }
  .hint{ color:var(--dim); font-size:12px; margin-top:10px; }
  .row{ display:flex; gap:8px; }
  .row button{ margin:4px 0; }
</style>
</head>
<body>
<h1>月圆之夜 · 联机通道测试</h1>
<p class="sub">零依赖 / 零服务器 · 浏览器原生 WebRTC 点对点。</p>

<div id="status" class="off">未连接</div>
<div id="note"></div>

<div class="cols">
  <div class="card">
    <h2>① 房主（发起方）</h2>
    <p>点「创建邀请码」，然后把 <b>邀请链接</b> 发给朋友（点开就带码，不用手动粘）。</p>
    <button id="hCreate">创建邀请码</button>
    <textarea id="hOffer" placeholder="邀请码会出现在这里"></textarea>
    <button class="ghost" id="hCopyOffer">复制邀请码</button>
    <button class="ghost" id="hCopyLink">复制邀请链接（推荐）</button>
    <p style="margin-top:10px">朋友回传应答码后，粘到这里（用链接回来的会自动填）：</p>
    <textarea id="hAnswer" placeholder="粘贴朋友回传的应答码"></textarea>
    <button id="hAccept">连接</button>
  </div>

  <div class="card">
    <h2>② 客人（加入方）</h2>
    <p>把房主的邀请码粘进来（点链接进来的会自动填）。</p>
    <textarea id="gOffer" placeholder="粘贴房主的邀请码"></textarea>
    <button id="gCreate">生成应答码</button>
    <textarea id="gAnswer" placeholder="把应答码回传给房主"></textarea>
    <button class="ghost" id="gCopyAnswer">复制应答码</button>
    <button class="ghost" id="gCopyLink">复制回复链接（推荐）</button>
  </div>
</div>

<div class="row" style="margin-top:12px">
  <button class="ghost" id="sendPing">发送测试消息</button>
</div>
<div id="log"></div>
<p class="hint">连上后顶部会变绿「已连接 ✅」。切到微信发消息不会丢，码会自动保存在本机；只有刷新页面才需要重新走一遍。</p>

<script>
const ICE = { iceServers: [
  { urls: 'stun:stun.miwifi.com:3478' },
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
]};
const LS = { role:'yy_role', offer:'yy_offer', answer:'yy_answer' };
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(m){ logEl.textContent += `[${new Date().toLocaleTimeString()}] ${m}\n`; logEl.scrollTop = logEl.scrollHeight; }
function setStatus(t, cls){ const s=$('status'); s.textContent=t; s.className=cls||''; }
function note(msg){ const n=$('note'); if(msg){ n.textContent = msg; n.style.display='block'; } else n.style.display='none'; }
function save(k, v){ try{ v ? localStorage.setItem(k, v) : localStorage.removeItem(k); }catch{} }
function load(k){ try{ return localStorage.getItem(k); }catch{ return null; } }

const b64e = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c=>c.charCodeAt(0));
async function enc(obj){
  const json = JSON.stringify(obj);
  if(typeof CompressionStream === 'undefined') return 'raw:' + b64e(new TextEncoder().encode(json));
  const cs = new CompressionStream('gzip');
  const w = cs.writable.getWriter(); w.write(new TextEncoder().encode(json)); w.close();
  return 'gz:' + b64e(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
}
async function dec(code){
  code = (code||'').trim().replace(/\s+/g,'');
  if(code.startsWith('raw:')) return JSON.parse(new TextDecoder().decode(b64d(code.slice(4))));
  if(code.startsWith('gz:')){
    const ds = new DecompressionStream('gzip'); const w = ds.writable.getWriter();
    w.write(b64d(code.slice(3))); w.close();
    return JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()));
  }
  throw new Error('码格式不对（应以 gz: 或 raw: 开头）');
}

let pc = null, dc = null, role = '';
function setupDC(){
  dc.onopen = () => { setStatus('已连接 ✅（' + role + '）', 'on'); note(''); log(role + ' 数据通道已打开'); dc.send('hello from ' + role); };
  dc.onclose = () => { setStatus('已断开', 'off'); log('数据通道关闭'); };
  dc.onerror = e => log('数据通道错误: ' + (e.message||e));
  dc.onmessage = e => { log('收到: ' + e.data); if(e.data === 'ping') dc.send('pong from ' + role); };
}
function waitIce(p){
  if(p.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise(res => { let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
    const t = setTimeout(fin, 4000);
    p.addEventListener('icegatheringstatechange', () => { if(p.iceGatheringState==='complete'){ clearTimeout(t); fin(); } }); });
}

window.hostStart = async function(){
  role = '房主';
  pc = new RTCPeerConnection(ICE);
  pc.onconnectionstatechange = () => log('房主连接态: ' + pc.connectionState);
  dc = pc.createDataChannel('game', { ordered:true });
  setupDC();
  await pc.setLocalDescription(await pc.createOffer());
  await waitIce(pc);
  return await enc(pc.localDescription);
};
window.hostAccept = async function(answerCode){ await pc.setRemoteDescription(await dec(answerCode)); return 'ok'; };
window.guestStart = async function(offerCode){
  role = '客人';
  pc = new RTCPeerConnection(ICE);
  pc.onconnectionstatechange = () => log('客人连接态: ' + pc.connectionState);
  pc.ondatachannel = e => { dc = e.channel; setupDC(); };
  await pc.setRemoteDescription(await dec(offerCode));
  await pc.setLocalDescription(await pc.createAnswer());
  await waitIce(pc);
  return await enc(pc.localDescription);
};
window.sendMsg = m => { if(dc && dc.readyState === 'open'){ dc.send(m); return 'sent'; } return 'not-open'; };
window.dcState = () => dc ? dc.readyState : 'none';
window.pcState = () => pc ? pc.connectionState : 'none';

function linkFor(k, v){ return location.origin + location.pathname + '#' + k + '=' + encodeURIComponent(v); }

// ---- 启动：先读 URL 里的码，再读本机保存的 ----
(function init(){
  const h = location.hash.slice(1);
  const q = new URLSearchParams(h);
  const oUrl = q.get('o'), aUrl = q.get('a');
  if(oUrl){ $('gOffer').value = oUrl; note('📨 收到邀请码，已自动填入「② 客人」。点「生成应答码」继续。'); log('从链接读入邀请码'); }
  if(aUrl){ $('hAnswer').value = aUrl; note('📨 收到应答码，已自动填入「① 房主」。点「连接」继续。'); log('从链接读入应答码'); }
  if(!oUrl){ const so = load(LS.offer); if(so){ $('hOffer').value = so; log('恢复上次的邀请码（本机保存）'); } }
  if(!aUrl){ const sa = load(LS.answer); if(sa){ $('hAnswer').value = sa; log('恢复上次的应答码（本机保存）'); } }
})();

// ---- UI ----
$('hCreate').onclick = async () => {
  try{ $('hCreate').disabled = true; note(''); log('正在生成邀请码…');
    const c = await hostStart(); $('hOffer').value = c; save(LS.offer, c);
    log('邀请码已生成，长度 ' + c.length + ' 字符（已存本机）');
  }catch(e){ log('出错: ' + e.message); $('hCreate').disabled = false; }
};
$('hCopyOffer').onclick = () => { if($('hOffer').value){ navigator.clipboard.writeText($('hOffer').value); log('已复制邀请码'); } };
$('hCopyLink').onclick = () => { if($('hOffer').value){ navigator.clipboard.writeText(linkFor('o', $('hOffer').value)); log('已复制邀请链接'); } };
$('hAccept').onclick = async () => { try{ note(''); log('正在连接…'); await hostAccept($('hAnswer').value); save(LS.answer, $('hAnswer').value); log('已应用应答码，等待通道打开…'); }catch(e){ log('出错: ' + e.message); } };
$('gCreate').onclick = async () => {
  try{ $('gCreate').disabled = true; note(''); log('正在生成应答码…');
    const c = await guestStart($('gOffer').value); $('gAnswer').value = c; save(LS.answer, c);
    log('应答码已生成，长度 ' + c.length + ' 字符（已存本机），回传房主');
  }catch(e){ log('出错: ' + e.message); $('gCreate').disabled = false; }
};
$('gCopyAnswer').onclick = () => { if($('gAnswer').value){ navigator.clipboard.writeText($('gAnswer').value); log('已复制应答码'); } };
$('gCopyLink').onclick = () => { if($('gAnswer').value){ navigator.clipboard.writeText(linkFor('a', $('gAnswer').value)); log('已复制回复链接'); } };
$('sendPing').onclick = () => log('发送 ping → ' + sendMsg('ping'));
</script>
</body>
</html>
